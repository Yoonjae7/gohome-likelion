<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>퇴근해 · 주간 근무 트래커</title>
<meta name="description" content="주간 근무 시간을 추적하고 정확한 퇴근 시간을 확인하세요."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0b0b0f;
  --bg2:#111117;
  --bg3:#16161e;
  --border:rgba(255,255,255,0.08);
  --border2:rgba(255,255,255,0.15);
  --text1:#e8e8f0;
  --text2:#7a7a96;
  --text3:#a0a0c0;
  --accent:#7c5cfc;
  --cyan:#00d4ff;
  --green:#00e5a0;
  --pink:#ff4d8d;
  --yellow:#ffd93d;
  --orange:#ff8c42;
  --r:14px;
  --r-sm:9px;
}

html{font-size:16px}
body{
  font-family:'Outfit',sans-serif;
  background:var(--bg);
  color:var(--text1);
  min-height:100vh;
  overflow-x:hidden;
}

body::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;z-index:0;opacity:0.6;
}
.glow-a{position:fixed;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(124,92,252,0.14),transparent 70%);top:-200px;left:-200px;pointer-events:none;z-index:0}
.glow-b{position:fixed;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(0,212,255,0.09),transparent 70%);bottom:-150px;right:-100px;pointer-events:none;z-index:0}

.app{position:relative;z-index:1;max-width:1140px;margin:0 auto;padding:1.5rem 1rem 5rem}

/* ══ HEADER ══ */
.header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:2rem;padding-bottom:1.5rem;
  border-bottom:1px solid var(--border);
  animation:fadeDown 0.6s ease both;
  gap:1rem;flex-wrap:wrap;
}
@keyframes fadeDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
.header-left{display:flex;align-items:center;gap:1.2rem}
.logo-img{
  height:110px;width:auto;
  filter:drop-shadow(0 0 20px rgba(124,92,252,0.5)) drop-shadow(0 0 40px rgba(0,212,255,0.25));
  animation:lionFloat 4s ease-in-out infinite;flex-shrink:0;
}
@keyframes lionFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
.header-title h1{font-size:1.6rem;font-weight:800;letter-spacing:-0.03em;line-height:1.15}
.header-title h1 span{
  background:linear-gradient(90deg,#7c5cfc,#00d4ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.header-title p{font-size:0.85rem;color:var(--text2);margin-top:0.25rem}
.header-right{display:flex;flex-direction:column;align-items:flex-end;gap:0.2rem}
.live-badge{
  display:flex;align-items:center;gap:0.4rem;font-size:0.7rem;font-weight:700;
  text-transform:uppercase;letter-spacing:0.12em;
  color:var(--green);background:rgba(0,229,160,0.1);border:1px solid rgba(0,229,160,0.3);
  padding:0.25rem 0.65rem;border-radius:50px;
}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.8)}}
#clock-display{
  font-family:'JetBrains Mono',monospace;
  font-size:1.9rem;font-weight:700;letter-spacing:-0.02em;
  background:linear-gradient(90deg,#00d4ff,#7c5cfc);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
#date-display{font-size:0.82rem;color:var(--text3);font-family:'JetBrains Mono',monospace}

/* ══ SECTION LABEL ══ */
.sec-label{
  font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.16em;
  color:var(--text2);display:flex;align-items:center;gap:0.6rem;margin-bottom:1rem;
}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* ══════════════════════════════════════════
   DESKTOP TABLE (≥768px)
══════════════════════════════════════════ */
.week-table-wrap{
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);
  overflow:hidden;margin-bottom:1.5rem;
  animation:fadeUp 0.6s ease 0.15s both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

.week-table-header{
  display:grid;grid-template-columns:96px repeat(5,1fr);
  background:var(--bg3);border-bottom:1px solid var(--border);
}
.wth-cell{
  padding:0.8rem 0.5rem;text-align:center;border-right:1px solid var(--border);
  font-size:0.8rem;font-weight:600;color:var(--text2);
}
.wth-cell:first-child{text-align:left;padding-left:1rem}
.wth-cell:last-child{border-right:none}
.wth-cell .dn{font-weight:700;color:var(--text3);font-size:0.85rem}
.wth-cell.t-col .dn{color:var(--cyan)}
.today-badge{
  display:inline-block;background:rgba(0,212,255,0.15);border:1px solid rgba(0,212,255,0.4);
  color:var(--cyan);font-size:0.65rem;font-weight:700;padding:0.15rem 0.45rem;border-radius:4px;
  margin-top:0.25rem;
}

.week-row-dt{
  display:grid;grid-template-columns:96px repeat(5,1fr);
  border-bottom:1px solid var(--border);transition:background 0.2s;
}
.week-row-dt:last-child{border-bottom:none}
.week-row-dt:hover{background:rgba(255,255,255,0.015)}

.rl{
  padding:0.65rem 0.5rem 0.65rem 1rem;
  font-size:0.78rem;color:var(--text2);border-right:1px solid var(--border);
  display:flex;align-items:center;font-weight:500;
}
.dc{
  padding:0.42rem 0.35rem;border-right:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  min-height:44px;font-size:0.82rem;
}
.dc:last-child{border-right:none}
.dc.t-col .tp-sel:focus{border-color:rgba(0,212,255,0.7);box-shadow:0 0 0 2px rgba(0,212,255,0.18);background:rgba(0,212,255,0.06)}

/* ══ TIME PICKER (shared) ══ */
.time-picker{display:flex;align-items:center;gap:2px;justify-content:center;flex-wrap:nowrap}
.tp-sel{
  appearance:none;-webkit-appearance:none;
  background:rgba(255,255,255,0.07);border:1px solid var(--border2);
  border-radius:7px;padding:0.28rem 0.22rem;
  color:var(--text1);font-family:'JetBrains Mono',monospace;
  font-size:0.78rem;font-weight:500;outline:none;cursor:pointer;text-align:center;
  transition:border-color 0.2s,box-shadow 0.2s,background 0.2s;
}
.tp-sel:hover{background:rgba(255,255,255,0.1)}
.tp-sel:focus{border-color:rgba(124,92,252,0.7);box-shadow:0 0 0 2px rgba(124,92,252,0.18);background:rgba(124,92,252,0.08)}
.tp-ampm{
  font-size:0.72rem;font-weight:700;min-width:42px;
  background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.3);color:var(--cyan);
}
.tp-ampm:focus{border-color:rgba(0,212,255,0.7);box-shadow:0 0 0 2px rgba(0,212,255,0.18)}
.tp-sep{color:var(--text2);font-family:'JetBrains Mono',monospace;font-size:0.9rem;margin:0 1px}

/* future plan color tint */
.tp-sel.future-tp{border-color:rgba(124,92,252,0.4)}
.tp-sel.future-tp:focus{border-color:rgba(124,92,252,0.8)}
.tp-ampm.future-tp{background:rgba(124,92,252,0.1);border-color:rgba(124,92,252,0.4);color:#a688ff}
.tp-ampm.future-tp:focus{border-color:rgba(124,92,252,0.8);box-shadow:0 0 0 2px rgba(124,92,252,0.18)}

/* pills */
.status-pill{
  display:inline-flex;align-items:center;gap:0.3rem;
  font-size:0.7rem;font-weight:700;padding:0.22rem 0.6rem;border-radius:50px;
  letter-spacing:0.04em;white-space:nowrap;
}
.pill-done{background:rgba(0,229,160,0.15);border:1px solid rgba(0,229,160,0.4);color:var(--green)}
.pill-today{background:rgba(0,212,255,0.15);border:1px solid rgba(0,212,255,0.5);color:var(--cyan);animation:todayGlow 2s ease-in-out infinite}
@keyframes todayGlow{0%,100%{box-shadow:0 0 0 0 rgba(0,212,255,0)}50%{box-shadow:0 0 8px 2px rgba(0,212,255,0.2)}}
.pill-plan{background:rgba(124,92,252,0.15);border:1px solid rgba(124,92,252,0.4);color:#a688ff}
.dash-mark{color:var(--border2);font-size:1rem}

/* ══════════════════════════════════════════
   MOBILE CARDS (< 768px)
══════════════════════════════════════════ */
.week-cards{display:none;flex-direction:column;gap:0.9rem;margin-bottom:1.5rem}

.day-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);
  overflow:hidden;animation:fadeUp 0.5s ease both;
}
.day-card-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0.85rem 1rem;background:var(--bg3);border-bottom:1px solid var(--border);
}
.day-card-title{font-size:1rem;font-weight:700;color:var(--text1)}
.day-card-title.t-title{color:var(--cyan)}
.day-card-title.f-title{color:#a688ff}

.day-card-body{padding:0.9rem 1rem;display:flex;flex-direction:column;gap:0.75rem}
.card-row{display:flex;align-items:center;justify-content:space-between;gap:0.5rem;flex-wrap:wrap}
.card-row-label{font-size:0.8rem;color:var(--text2);font-weight:500;min-width:70px}
.card-row-val{
  font-size:0.85rem;font-family:'JetBrains Mono',monospace;color:var(--text3);
}
.card-row-val.green{color:var(--green);font-weight:600}

/* mobile time picker — bigger selects */
.tp-sel-lg{
  appearance:none;-webkit-appearance:none;
  background:rgba(255,255,255,0.07);border:1px solid var(--border2);
  border-radius:9px;padding:0.45rem 0.4rem;
  color:var(--text1);font-family:'JetBrains Mono',monospace;
  font-size:0.92rem;font-weight:500;outline:none;cursor:pointer;text-align:center;
  transition:border-color 0.2s,box-shadow 0.2s,background 0.2s;
  -webkit-tap-highlight-color:transparent;
}
.tp-sel-lg:focus{border-color:rgba(124,92,252,0.7);box-shadow:0 0 0 3px rgba(124,92,252,0.2);background:rgba(124,92,252,0.08)}
.tp-ampm-lg{
  font-size:0.88rem;font-weight:700;min-width:52px;
  background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.3);color:var(--cyan);
}
.tp-ampm-lg:focus{border-color:rgba(0,212,255,0.7);box-shadow:0 0 0 3px rgba(0,212,255,0.2)}
.tp-ampm-lg.future-tp{background:rgba(124,92,252,0.1);border-color:rgba(124,92,252,0.4);color:#a688ff}
.tp-sep-lg{color:var(--text2);font-family:'JetBrains Mono',monospace;font-size:1.1rem;margin:0 2px}

/* ══ ACTION BAR ══ */
.action-bar{
  background:var(--bg3);padding:0.85rem 1rem;
  display:flex;align-items:center;justify-content:flex-end;gap:0.75rem;
  border-top:1px solid var(--border);
}
.btn-primary{
  padding:0.6rem 1.3rem;border:none;border-radius:var(--r-sm);
  font-family:'Outfit',sans-serif;font-size:0.9rem;font-weight:700;color:#fff;
  cursor:pointer;background:linear-gradient(135deg,#7c5cfc,#00d4ff);
  box-shadow:0 4px 18px rgba(124,92,252,0.4);
  transition:transform 0.2s,box-shadow 0.2s;
  -webkit-tap-highlight-color:transparent;
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(124,92,252,0.6)}
.btn-primary:active{transform:scale(0.97)}
.btn-ghost{
  padding:0.6rem 1rem;border:1px solid var(--border2);border-radius:var(--r-sm);
  background:transparent;color:var(--text3);font-family:'Outfit',sans-serif;
  font-size:0.88rem;cursor:pointer;transition:all 0.2s;
  -webkit-tap-highlight-color:transparent;
}
.btn-ghost:hover{background:rgba(255,255,255,0.05);color:var(--text1)}

/* ══ STATS ROW ══ */
.stats-row{
  display:grid;grid-template-columns:repeat(4,1fr);gap:0.9rem;
  margin-bottom:1.5rem;
  animation:fadeUp 0.6s ease 0.3s both;
}
.stat-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);
  padding:1.1rem 1rem;position:relative;overflow:hidden;
  transition:border-color 0.25s,transform 0.25s;
}
.stat-card:hover{border-color:var(--border2);transform:translateY(-2px)}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--gradient,linear-gradient(90deg,#7c5cfc,#00d4ff))}
.sc-g1{--gradient:linear-gradient(90deg,#7c5cfc,#00d4ff)}
.sc-g2{--gradient:linear-gradient(90deg,#ff4d8d,#ffd93d)}
.sc-g3{--gradient:linear-gradient(90deg,#00e5a0,#00d4ff)}
.sc-g4{--gradient:linear-gradient(90deg,#ffd93d,#ff8c42)}
.stat-val{font-size:1.75rem;font-weight:800;letter-spacing:-0.03em;margin-bottom:0.2rem;font-variant-numeric:tabular-nums}
.sv-purple{background:linear-gradient(135deg,#7c5cfc,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sv-pink{background:linear-gradient(135deg,#ff4d8d,#ffd93d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sv-green{background:linear-gradient(135deg,#00e5a0,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sv-yellow{background:linear-gradient(135deg,#ffd93d,#ff8c42);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-label{font-size:0.73rem;color:var(--text2);font-weight:500;letter-spacing:0.06em;text-transform:uppercase}

/* ══ PROGRESS ══ */
.progress-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);
  padding:1.5rem;margin-bottom:1.5rem;
  animation:fadeUp 0.6s ease 0.4s both;
}
.prog-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem}
.prog-title{font-size:1.05rem;font-weight:700}
.prog-pct-badge{
  font-size:0.85rem;font-weight:700;font-family:'JetBrains Mono',monospace;
  background:rgba(124,92,252,0.15);border:1px solid rgba(124,92,252,0.3);
  color:#a688ff;padding:0.28rem 0.75rem;border-radius:50px;
}
.rainbow-bar-wrap{
  position:relative;height:38px;border-radius:50px;
  background:rgba(255,255,255,0.04);border:1px solid var(--border2);
  overflow:hidden;margin-bottom:0.75rem;
}
.rainbow-fill{
  height:100%;border-radius:50px;width:0%;
  background:linear-gradient(90deg,#ff0080,#ff3040,#ff6820,#ffd700,#40ff00,#00ffcc,#00ccff,#5555ff,#cc00ff,#ff0080);
  background-size:400% 100%;
  animation:rainbowFlow 5s linear infinite;
  transition:width 1.5s cubic-bezier(0.34,1.56,0.64,1);
  position:relative;
}
@keyframes rainbowFlow{0%{background-position:0% 50%}100%{background-position:400% 50%}}
.rainbow-fill::after{content:'';position:absolute;inset:0;border-radius:50px;background:linear-gradient(180deg,rgba(255,255,255,0.4) 0%,transparent 55%)}
.rainbow-fill::before{content:'';position:absolute;right:-3px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:inherit;filter:blur(6px);opacity:0.85}
.bar-shimmer{position:absolute;inset:0;border-radius:50px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.28),transparent);animation:shimmerSweep 2.5s ease-in-out infinite}
@keyframes shimmerSweep{0%{transform:translateX(-150%)}100%{transform:translateX(500%)}}
.bar-marks{position:absolute;inset:0;border-radius:50px;pointer-events:none}
.bar-mark{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,0.2)}

.prog-labels{display:flex;justify-content:space-between;font-size:0.8rem;color:var(--text2);font-family:'JetBrains Mono',monospace}
.prog-labels span:nth-child(2){font-weight:600;color:var(--text1)}

.predict-banner{
  margin-top:1.2rem;padding:1rem 1.2rem;border-radius:var(--r-sm);
  background:rgba(124,92,252,0.08);border:1px solid rgba(124,92,252,0.25);
  display:flex;align-items:flex-start;gap:0.85rem;font-size:0.88rem;line-height:1.7;
}
.predict-icon{font-size:1.35rem;flex-shrink:0;margin-top:0.05rem}
.predict-text .highlight{background:linear-gradient(90deg,#7c5cfc,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:700;font-size:0.93rem}
.predict-text strong{color:#a688ff}
.done-banner{
  margin-top:1.2rem;padding:1.1rem 1.3rem;border-radius:var(--r-sm);
  background:linear-gradient(135deg,rgba(0,229,160,0.15),rgba(0,212,255,0.1));
  border:1px solid rgba(0,229,160,0.4);
  display:flex;align-items:center;gap:0.85rem;font-size:0.92rem;
}
.done-banner .done-icon{font-size:1.9rem;animation:bounce 1s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.done-banner strong{color:var(--green);font-size:1rem}

/* ══ TOAST ══ */
.toast{
  position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(80px);
  background:rgba(22,22,30,0.95);backdrop-filter:blur(16px);
  border:1px solid var(--border2);border-radius:50px;
  padding:0.7rem 1.4rem;font-size:0.88rem;color:var(--text1);
  z-index:999;transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1),opacity 0.35s;
  opacity:0;pointer-events:none;white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

footer{text-align:center;color:var(--text2);font-size:0.78rem;padding-top:2rem}

/* ══════════════════════════════════════════
   RESPONSIVE BREAKPOINTS
══════════════════════════════════════════ */
@media(max-width:767px){
  html{font-size:15px}
  .app{padding:1rem 0.85rem 4rem}
  .logo-img{height:80px}
  .header-title h1{font-size:1.3rem}
  #clock-display{font-size:1.5rem}
  /* hide desktop table, show cards */
  .week-table-wrap{display:none}
  .week-cards{display:flex}
  /* stats 2-col */
  .stats-row{grid-template-columns:1fr 1fr;gap:0.6rem}
  .stat-val{font-size:1.5rem}
  .progress-card{padding:1.1rem}
  .rainbow-bar-wrap{height:32px}
  .predict-banner{font-size:0.82rem;gap:0.65rem;padding:0.85rem 1rem}
  .header{margin-bottom:1.4rem;padding-bottom:1.1rem}
}
@media(max-width:400px){
  .header-left{gap:0.8rem}
  .logo-img{height:64px}
  .header-title h1{font-size:1.15rem}
  #clock-display{font-size:1.3rem}
  .stats-row{gap:0.5rem}
  .stat-val{font-size:1.35rem}
}
</style>
</head>
<body>
<div class="glow-a"></div>
<div class="glow-b"></div>

<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <img class="logo-img" src="jj라이언~.svg" alt="라이언" onerror="this.style.display='none'"/>
      <div class="header-title">
        <h1>이제 <span>퇴근</span>해도 돼</h1>
        <p>주간 근무 시간 트래커 · 휴게 자동 계산</p>
      </div>
    </div>
    <div class="header-right">
      <div class="live-badge"><div class="live-dot"></div>LIVE</div>
      <div id="clock-display">00:00:00</div>
      <div id="date-display">로딩 중...</div>
    </div>
  </header>

  <div class="sec-label">📅 이번 주 근무 현황</div>

  <!-- ──── DESKTOP TABLE ──── -->
  <div class="week-table-wrap" id="desk-wrap">
    <div class="week-table-header" id="desk-header">
      <div class="wth-cell">구분</div>
    </div>
    <div id="desk-rows"></div>
    <div class="action-bar">
      <button class="btn-ghost" id="btn-reset-d">초기화</button>
      <button class="btn-primary" id="btn-calc-d">✦ 계산하기</button>
    </div>
  </div>

  <!-- ──── MOBILE CARDS ──── -->
  <div class="week-cards" id="mob-cards"></div>
  <div class="action-bar" id="mob-actions" style="display:none;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:1.5rem;animation:fadeUp 0.6s ease 0.2s both">
    <button class="btn-ghost" id="btn-reset-m">초기화</button>
    <button class="btn-primary" id="btn-calc-m">✦ 계산하기</button>
  </div>

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card sc-g1"><div class="stat-val sv-purple" id="st-worked">0h</div><div class="stat-label">실 근무 시간</div></div>
    <div class="stat-card sc-g2"><div class="stat-val sv-pink"   id="st-remain">40h</div><div class="stat-label">남은 시간</div></div>
    <div class="stat-card sc-g3"><div class="stat-val sv-green"  id="st-break">0h</div><div class="stat-label">차감 휴게</div></div>
    <div class="stat-card sc-g4"><div class="stat-val sv-yellow" id="st-pct">0%</div><div class="stat-label">달성률</div></div>
  </div>

  <!-- PROGRESS -->
  <div class="progress-card">
    <div class="prog-header">
      <div class="prog-title">주 40시간 달성 현황</div>
      <div class="prog-pct-badge" id="pct-badge">0%</div>
    </div>
    <div class="rainbow-bar-wrap">
      <div class="rainbow-fill" id="bar-fill"></div>
      <div class="bar-shimmer"></div>
      <div class="bar-marks" id="bar-marks"></div>
    </div>
    <div class="prog-labels">
      <span>0h</span>
      <span id="prog-mid">—</span>
      <span>40h</span>
    </div>
    <div id="predict-area"></div>
  </div>

  <footer>💜 퇴근해 트래커 · 현명하게 일하고 제때 퇴근하세요</footer>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════ */
const TARGET = 40;
const DAYS_KO = ['일','월','화','수','목','금','토'];
const STORE = 'gohome-v5';

const pad = n => String(n).padStart(2,'0');
const calcBreak = g => g<=0 ? 0 : Math.floor(g/4)*0.5;
const netHrs    = g => Math.max(0, g - calcBreak(g));
function fmtHr(h){
  if(h==null||isNaN(h)||h<0) return '—';
  if(h===0) return '0h';
  const w=Math.floor(h), m=Math.round((h-w)*60);
  return m===0?`${w}h`:`${w}h ${pad(m)}m`;
}
function timeDecimal(str){ if(!str)return 0; const[h,m]=str.split(':').map(Number); return h+m/60; }
function getMonday(d){ const dt=new Date(d), day=dt.getDay(); dt.setDate(dt.getDate()+(day===0?-6:1-day)); dt.setHours(0,0,0,0); return dt; }

function loadData(){ try{return JSON.parse(localStorage.getItem(STORE))||{};}catch{return{};} }
function saveData(d){ localStorage.setItem(STORE, JSON.stringify(d)); }

/* ═══════════════════════════════════════════
   CLOCK
═══════════════════════════════════════════ */
function tick(){
  const now=new Date(), h=now.getHours(), m=now.getMinutes(), s=now.getSeconds();
  const ampm=h>=12?'오후':'오전', h12=h%12||12;
  document.getElementById('clock-display').textContent=`${pad(h12)}:${pad(m)}:${pad(s)}`;
  const yr=now.getFullYear(), mo=now.getMonth()+1, da=now.getDate();
  document.getElementById('date-display').textContent=`${yr}년 ${mo}월 ${da}일 (${DAYS_KO[now.getDay()]}요일) · ${ampm}`;
}
tick(); setInterval(tick,1000);

/* ═══════════════════════════════════════════
   WEEK SETUP
═══════════════════════════════════════════ */
const todayDate = new Date();
const monday = getMonday(todayDate);
const weekDays = Array.from({length:5},(_,i)=>{ const d=new Date(monday); d.setDate(monday.getDate()+i); return d; });

function dayStatus(i){
  const d=new Date(weekDays[i]); d.setHours(0,0,0,0);
  const now=new Date(); now.setHours(0,0,0,0);
  if(d<now) return 'past';
  if(d.getTime()===now.getTime()) return 'today';
  return 'future';
}

/* ═══════════════════════════════════════════
   TIME PICKER FACTORY
   size: 'sm' (desktop) | 'lg' (mobile)
   type: 'past'|'today'|'future'
═══════════════════════════════════════════ */
function makeTimePicker(savedVal, type, size, onChange){
  let initH24=9, initM=0;
  if(savedVal){ const p=savedVal.split(':').map(Number); initH24=p[0]; initM=p[1]; }

  const lg = size==='lg';
  const selCls  = lg ? 'tp-sel-lg' : 'tp-sel';
  const ampmCls = lg ? 'tp-ampm-lg' : 'tp-ampm';
  const sepCls  = lg ? 'tp-sep-lg' : 'tp-sep';
  const futureMod = type==='future' ? ' future-tp' : '';

  const wrap = document.createElement('div');
  wrap.className = 'time-picker';

  const ampmSel = document.createElement('select');
  ampmSel.className = `${selCls} ${ampmCls}${futureMod}`;
  ['오전','오후'].forEach(v=>{ const o=document.createElement('option');o.value=v;o.textContent=v;ampmSel.appendChild(o); });

  const hourSel = document.createElement('select');
  hourSel.className = `${selCls}${futureMod}`;
  hourSel.style.width = lg?'58px':'50px';
  for(let i=1;i<=12;i++){ const o=document.createElement('option');o.value=i;o.textContent=pad(i);hourSel.appendChild(o); }

  const sep = document.createElement('span');
  sep.className=sepCls; sep.textContent=':';

  const minSel = document.createElement('select');
  minSel.className = `${selCls}${futureMod}`;
  minSel.style.width = lg?'58px':'50px';
  for(let i=0;i<60;i+=10){ const o=document.createElement('option');o.value=i;o.textContent=pad(i);minSel.appendChild(o); }

  // Set initial
  ampmSel.value = initH24>=12?'오후':'오전';
  let h12=initH24%12; if(h12===0)h12=12; hourSel.value=h12;
  minSel.value = Math.round(initM/10)*10%60;

  wrap.append(ampmSel, hourSel, sep, minSel);

  function get24(){
    let h=parseInt(hourSel.value), m=parseInt(minSel.value);
    if(ampmSel.value==='오후'&&h!==12) h+=12;
    if(ampmSel.value==='오전'&&h===12) h=0;
    return `${pad(h)}:${pad(m)}`;
  }

  [ampmSel,hourSel,minSel].forEach(el=>el.addEventListener('change',()=>onChange(get24())));
  return wrap;
}

/* ═══════════════════════════════════════════
   COMPUTE DISPLAY VALUES
═══════════════════════════════════════════ */
function computeDay(dd, st){
  if(st==='future'){
    if(!dd.fstart||!dd.fend) return {gross:null,net:null};
    const g=timeDecimal(dd.fend)-timeDecimal(dd.fstart);
    return g>0?{gross:g,net:netHrs(g)}:{gross:null,net:null};
  }
  if(!dd.start||!dd.end) return {gross:null,net:null};
  const g=timeDecimal(dd.end)-timeDecimal(dd.start);
  return g>0?{gross:g,net:netHrs(g)}:{gross:null,net:null};
}

/* ═══════════════════════════════════════════
   BUILD DESKTOP TABLE
═══════════════════════════════════════════ */
function buildDesktop(){
  const data=loadData();

  // Header
  const hdr=document.getElementById('desk-header');
  hdr.innerHTML='<div class="wth-cell">구분</div>';
  weekDays.forEach((d,i)=>{
    const st=dayStatus(i);
    const cell=document.createElement('div');
    cell.className=`wth-cell${st==='today'?' t-col':''}`;
    const mo=d.getMonth()+1, da=d.getDate();
    let inner=`<div class="dn">${mo}월 ${da}일 (${DAYS_KO[d.getDay()]})</div>`;
    if(st==='today') inner+=`<div class="today-badge">오늘</div>`;
    cell.innerHTML=inner; hdr.appendChild(cell);
  });

  // Rows
  const rowsEl=document.getElementById('desk-rows');
  rowsEl.innerHTML='';

  const rowDefs=[
    {key:'status', label:'출결구분'},
    {key:'start',  label:'출근 시간'},
    {key:'end',    label:'퇴근 시간'},
    {key:'gross',  label:'총 근무'},
    {key:'net',    label:'인정 근무'},
  ];

  rowDefs.forEach(row=>{
    const tr=document.createElement('div'); tr.className='week-row-dt';
    const lbl=document.createElement('div'); lbl.className='rl'; lbl.textContent=row.label;
    tr.appendChild(lbl);

    weekDays.forEach((_,i)=>{
      const st=dayStatus(i);
      const cell=document.createElement('div');
      cell.className=`dc${st==='today'?' t-col':''}`;
      const dd=data[`day-${i}`]||{};

      if(row.key==='status'){
        if(st==='past')  cell.innerHTML=`<span class="status-pill pill-done">✓ 완료</span>`;
        else if(st==='today') cell.innerHTML=`<span class="status-pill pill-today">● 근무 중</span>`;
        else cell.innerHTML=`<span class="status-pill pill-plan">○ 예정</span>`;
      }
      else if(row.key==='start'){
        if(st==='past'||st==='today'){
          const pk=makeTimePicker(dd.start||null, st, 'sm', str=>{ saveDayField(i,'start',str); refreshDesktop(i); updateStats(); });
          cell.appendChild(pk);
        } else {
          // future start
          const pk=makeTimePicker(dd.fstart||null, 'future', 'sm', str=>{ saveDayField(i,'fstart',str); refreshDesktop(i); updateStats(); });
          cell.appendChild(pk);
        }
      }
      else if(row.key==='end'){
        if(st==='past'||st==='today'){
          const pk=makeTimePicker(dd.end||null, st, 'sm', str=>{ saveDayField(i,'end',str); refreshDesktop(i); updateStats(); });
          cell.appendChild(pk);
        } else {
          // future end
          const pk=makeTimePicker(dd.fend||null, 'future', 'sm', str=>{ saveDayField(i,'fend',str); refreshDesktop(i); updateStats(); });
          cell.appendChild(pk);
        }
      }
      else if(row.key==='gross'){
        const el=document.createElement('span');
        el.id=`d-gross-${i}`; el.style.cssText="font-family:'JetBrains Mono',monospace";
        const {gross}=computeDay(dd,st); el.textContent=gross?fmtHr(gross):'—';
        cell.appendChild(el);
      }
      else if(row.key==='net'){
        const el=document.createElement('span');
        el.id=`d-net-${i}`; el.style.cssText="font-family:'JetBrains Mono',monospace;color:var(--green);font-weight:600";
        const {net}=computeDay(dd,st); el.textContent=net?fmtHr(net):'—';
        cell.appendChild(el);
      }
      tr.appendChild(cell);
    });
    rowsEl.appendChild(tr);
  });
}

function refreshDesktop(i){
  const data=loadData(), dd=data[`day-${i}`]||{}, st=dayStatus(i);
  const {gross,net}=computeDay(dd,st);
  const ge=document.getElementById(`d-gross-${i}`);
  const ne=document.getElementById(`d-net-${i}`);
  if(ge) ge.textContent=gross?fmtHr(gross):'—';
  if(ne) ne.textContent=net?fmtHr(net):'—';
}

/* ═══════════════════════════════════════════
   BUILD MOBILE CARDS
═══════════════════════════════════════════ */
function buildMobile(){
  const data=loadData();
  const container=document.getElementById('mob-cards');
  container.innerHTML='';

  weekDays.forEach((d,i)=>{
    const st=dayStatus(i);
    const dd=data[`day-${i}`]||{};
    const {gross,net}=computeDay(dd,st);
    const mo=d.getMonth()+1, da=d.getDate();

    const card=document.createElement('div');
    card.className='day-card';
    card.style.animationDelay=`${i*0.07}s`;

    let pillHtml='';
    if(st==='past')  pillHtml=`<span class="status-pill pill-done">✓ 완료</span>`;
    else if(st==='today') pillHtml=`<span class="status-pill pill-today">● 근무 중</span>`;
    else pillHtml=`<span class="status-pill pill-plan">○ 예정</span>`;

    const titleCls = st==='today'?' t-title':st==='future'?' f-title':'';

    card.innerHTML=`
      <div class="day-card-header">
        <span class="day-card-title${titleCls}">${mo}월 ${da}일 (${DAYS_KO[d.getDay()]}요일)${st==='today'?' 🔵':''}</span>
        ${pillHtml}
      </div>
      <div class="day-card-body" id="mcb-${i}"></div>`;

    container.appendChild(card);
    buildMobileCardBody(i, st, dd, gross, net);
  });
}

function buildMobileCardBody(i, st, dd, gross, net){
  const body=document.getElementById(`mcb-${i}`);
  if(!body) return;
  body.innerHTML='';

  // Start time
  const startRow=document.createElement('div'); startRow.className='card-row';
  const startLbl=document.createElement('span'); startLbl.className='card-row-label'; startLbl.textContent='출근 시간';
  const startPk=makeTimePicker(
    st==='future'?(dd.fstart||null):(dd.start||null),
    st,'lg',
    str=>{ saveDayField(i, st==='future'?'fstart':'start', str); refreshMobile(i); updateStats(); }
  );
  startRow.appendChild(startLbl); startRow.appendChild(startPk);
  body.appendChild(startRow);

  // End time
  const endRow=document.createElement('div'); endRow.className='card-row';
  const endLbl=document.createElement('span'); endLbl.className='card-row-label';
  endLbl.textContent = st==='today'?'예상 퇴근':'퇴근 시간';
  const endPk=makeTimePicker(
    st==='future'?(dd.fend||null):(dd.end||null),
    st,'lg',
    str=>{ saveDayField(i, st==='future'?'fend':'end', str); refreshMobile(i); updateStats(); }
  );
  endRow.appendChild(endLbl); endRow.appendChild(endPk);
  body.appendChild(endRow);

  // Totals
  const grossRow=document.createElement('div'); grossRow.className='card-row';
  grossRow.innerHTML=`<span class="card-row-label">총 근무</span><span class="card-row-val" id="m-gross-${i}">${gross?fmtHr(gross):'—'}</span>`;
  body.appendChild(grossRow);

  const netRow=document.createElement('div'); netRow.className='card-row';
  netRow.innerHTML=`<span class="card-row-label">인정 근무</span><span class="card-row-val green" id="m-net-${i}">${net?fmtHr(net):'—'}</span>`;
  body.appendChild(netRow);
}

function refreshMobile(i){
  const data=loadData(), dd=data[`day-${i}`]||{}, st=dayStatus(i);
  const {gross,net}=computeDay(dd,st);
  const ge=document.getElementById(`m-gross-${i}`);
  const ne=document.getElementById(`m-net-${i}`);
  if(ge) ge.textContent=gross?fmtHr(gross):'—';
  if(ne) ne.textContent=net?fmtHr(net):'—';
}

/* ═══════════════════════════════════════════
   STATS + PROGRESS
═══════════════════════════════════════════ */
function computeAll(){
  const data=loadData();
  let workedNet=0, workedBreak=0, plannedNet=0;
  weekDays.forEach((_,i)=>{
    const st=dayStatus(i), dd=data[`day-${i}`]||{};
    const {gross,net}=computeDay(dd,st);
    if(gross==null) return;
    if(st==='future'){ plannedNet+=net||0; }
    else { workedNet+=net||0; workedBreak+=calcBreak(gross); }
  });
  return {workedNet,workedBreak,plannedNet};
}

function updateStats(){
  const {workedNet,workedBreak,plannedNet}=computeAll();
  const total=workedNet+plannedNet;
  const pct=Math.min(100,(workedNet/TARGET)*100);
  const pctIfPlan=Math.min(100,(total/TARGET)*100);
  const remain=Math.max(0,TARGET-workedNet);

  document.getElementById('st-worked').textContent=fmtHr(workedNet);
  document.getElementById('st-remain').textContent=fmtHr(remain);
  document.getElementById('st-break').textContent=fmtHr(workedBreak);
  document.getElementById('st-pct').textContent=`${Math.round(pct)}%`;
  document.getElementById('bar-fill').style.width=pct+'%';
  document.getElementById('pct-badge').textContent=`${Math.round(pct)}%`;
  document.getElementById('prog-mid').textContent=`${fmtHr(workedNet)} / 40h 완료`;

  // marks
  const marks=document.getElementById('bar-marks'); marks.innerHTML='';
  [25,50,75].forEach(p=>{ const el=document.createElement('div');el.className='bar-mark';el.style.left=p+'%';marks.appendChild(el); });

  // predict
  const area=document.getElementById('predict-area');
  if(workedNet>=TARGET){
    area.innerHTML=`<div class="done-banner"><span class="done-icon">🏠</span><div><strong>완료! 이제 퇴근해도 됩니다!</strong><br/><span style="font-size:0.83rem;color:var(--text3)">주 40시간 목표 달성! 수고하셨어요 🎉</span></div></div>`;
  } else if(plannedNet>0){
    const willDone=total>=TARGET, stillNeed=Math.max(0,TARGET-total);
    area.innerHTML=`<div class="predict-banner"><span class="predict-icon">${willDone?'🎯':'📊'}</span>
    <div class="predict-text">${willDone
      ?`예정대로 일하면 이번 주 <span class="highlight">총 ${fmtHr(total)}</span>이 채워져요! <strong style="color:var(--green)">목표 달성 ✓</strong>`
      :`예정대로 일하면 이번 주 <span class="highlight">총 ${fmtHr(total)}</span>이 채워져요. <strong style="color:var(--pink)">${fmtHr(stillNeed)}</strong> 더 필요해요.`
    }<br/><span style="font-size:0.8rem;color:var(--text2)">현재 ${fmtHr(workedNet)} + 예정 ${fmtHr(plannedNet)} = ${Math.round(pctIfPlan)}% 달성 예상</span>
    </div></div>`;
  } else {
    area.innerHTML=`<div class="predict-banner"><span class="predict-icon">💡</span>
    <div class="predict-text">현재까지 <span class="highlight">${fmtHr(workedNet)}</span> 근무했어요. 목표까지 <strong>${fmtHr(remain)}</strong> 남았습니다.<br/>
    <span style="font-size:0.8rem;color:var(--text2)">남은 날 예상 출퇴근 시간을 입력하면 달성 여부를 알 수 있어요 👆</span>
    </div></div>`;
  }
}

/* ═══════════════════════════════════════════
   DATA HELPERS
═══════════════════════════════════════════ */
function saveDayField(i, field, val){
  const data=loadData();
  if(!data[`day-${i}`]) data[`day-${i}`]={};
  data[`day-${i}`][field]=val;
  saveData(data);
}

function doReset(){
  if(!confirm('이번 주 입력 내용을 모두 초기화할까요?')) return;
  localStorage.removeItem(STORE);
  buildDesktop(); buildMobile(); updateStats();
  showToast('초기화되었습니다');
}
function doCalc(){ updateStats(); showToast('✦ 계산 완료!'); }

document.getElementById('btn-calc-d').addEventListener('click', doCalc);
document.getElementById('btn-reset-d').addEventListener('click', doReset);
document.getElementById('btn-calc-m').addEventListener('click', doCalc);
document.getElementById('btn-reset-m').addEventListener('click', doReset);

/* ═══════════════════════════════════════════
   RESPONSIVE: show/hide mobile actions
═══════════════════════════════════════════ */
function handleResize(){
  const mob=window.innerWidth<768;
  document.getElementById('mob-actions').style.display=mob?'flex':'none';
}
handleResize();
window.addEventListener('resize', handleResize);

function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg;
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2800);
}

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
buildDesktop();
buildMobile();
updateStats();
</script>
</body>
</html>
