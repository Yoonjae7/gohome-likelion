<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>퇴근해 · 주간 근무 트래커</title>
<meta name="description" content="주간 근무 시간을 추적하고 정확한 퇴근 시간을 확인하세요."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f8;--bg2:#ffffff;--bg3:#eeeef2;
  --border:rgba(0,0,0,0.06);--border2:rgba(0,0,0,0.1);
  --text1:#1a1a2e;--text2:#6b6b80;--text3:#8888a0;
  --accent:#6c4ce0;--accent-light:#e8e0ff;
  --green:#22c55e;--green-bg:#e8faf0;
  --pink:#ef4444;--pink-bg:#fde8e8;
  --blue:#3b82f6;--blue-bg:#e8f0fe;
  --r:16px;--r-sm:10px;--r-lg:22px;
  --shadow:0 2px 12px rgba(0,0,0,0.06);
  --shadow-lg:0 8px 32px rgba(0,0,0,0.08);
}
html{font-size:16px}
body{
  font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text1);
  min-height:100vh;overflow-x:hidden;
  display:flex;flex-direction:column;align-items:center;
}

/* ══ CREDIT BAR ══ */
.credit-bar{
  width:100%;background:var(--bg2);border-bottom:1px solid var(--border);
  padding:0.35rem 1rem;
  display:flex;align-items:center;justify-content:center;
  gap:0.4rem;font-size:0.72rem;color:var(--text2);
}
.credit-bar .cn{color:var(--accent);font-weight:700}
.credit-bar .cr{color:var(--text3)}
.credit-bar .cd{
  font-size:0.65rem;background:var(--bg3);border:1px solid var(--border);
  padding:0.08rem 0.45rem;border-radius:50px;color:var(--text2);
}

/* ══ APP CONTAINER ══ */
.app{width:100%;max-width:960px;padding:0 1rem 3rem;position:relative}

/* ══ MAIN LAYOUT ══ */
.main-content{display:flex;gap:1.5rem;align-items:flex-start}
.main-left{flex:1;min-width:0}
.main-right{width:320px;flex-shrink:0;align-self:flex-start;margin-top:3.5rem}

/* ══ HEADER ══ */
.header{
  display:flex;flex-direction:column;align-items:center;
  padding:1.5rem 0 1rem;text-align:center;
  animation:fadeIn 0.5s ease both;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

.logo-img{
  height:140px;width:auto;
  filter:drop-shadow(0 8px 24px rgba(108,76,224,0.2));
  animation:lionFloat 4s ease-in-out infinite;
  margin-bottom:0.6rem;
}
@keyframes lionFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}

.header h1{font-size:1.6rem;font-weight:800;letter-spacing:-0.03em;color:var(--text1)}
.header h1 span{color:var(--accent)}
.header p{font-size:0.82rem;color:var(--text2);margin-top:0.2rem}

/* clock row */
.clock-row{
  display:flex;align-items:center;gap:0.65rem;
  margin-top:0.7rem;
  padding:0.5rem 1rem;
  background:var(--bg2);border:1px solid var(--border);border-radius:50px;
  box-shadow:var(--shadow);
}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.5s ease-in-out infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.7)}}
#clock-display{
  font-family:'JetBrains Mono',monospace;font-size:1.05rem;font-weight:700;
  color:var(--text1);letter-spacing:-0.01em;
}
#date-display{font-size:0.72rem;color:var(--text3);font-family:'JetBrains Mono',monospace}

/* ══ DAY NAV DOTS ══ */
.day-nav{
  display:flex;align-items:center;justify-content:center;
  gap:0.5rem;margin:1.2rem 0 0.6rem;
}
.day-dot{
  width:36px;height:36px;border-radius:50%;border:2px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  font-size:0.7rem;font-weight:700;color:var(--text2);
  cursor:pointer;transition:all 0.3s ease;
  background:var(--bg2);
  -webkit-tap-highlight-color:transparent;
}
.day-dot:hover{border-color:var(--accent);color:var(--accent)}
.day-dot.active{
  background:var(--accent);border-color:var(--accent);color:#fff;
  transform:scale(1.15);box-shadow:0 2px 12px rgba(108,76,224,0.3);
}
.day-dot.done{border-color:var(--green);color:var(--green)}
.day-dot.done.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* ══ CAROUSEL ══ */
.carousel-wrap{
  position:relative;overflow:hidden;
  margin:0 -1rem;padding:0 1rem;
}
.carousel-wrap::before,
.carousel-wrap::after{
  content:'';position:absolute;top:0;bottom:0;width:2.5rem;
  z-index:8;pointer-events:none;
}
.carousel-wrap::before{left:0;background:linear-gradient(to right,var(--bg),transparent)}
.carousel-wrap::after{right:0;background:linear-gradient(to left,var(--bg),transparent)}
.carousel-track{
  display:flex;
  transition:transform 0.45s cubic-bezier(0.4,0,0.2,1);
  will-change:transform;
}
.day-card{
  min-width:100%;flex-shrink:0;
  padding:0 0.25rem;
}
.day-card-inner{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:1.6rem 1.4rem;
  box-shadow:var(--shadow-lg);
  transition:transform 0.3s ease,opacity 0.3s ease;
}

/* card header */
.dc-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:1.4rem;
}
.dc-day-name{font-size:1.5rem;font-weight:800;color:var(--text1)}
.dc-date{font-size:0.82rem;color:var(--text2);font-weight:500}
.dc-status{
  font-size:0.68rem;font-weight:700;padding:0.25rem 0.7rem;border-radius:50px;
  letter-spacing:0.03em;
}
.dc-status.past{background:var(--green-bg);color:var(--green)}
.dc-status.today{background:var(--blue-bg);color:var(--blue)}
.dc-status.future{background:var(--accent-light);color:var(--accent)}

/* input groups */
.dc-fields{display:flex;flex-direction:column;gap:1rem}
.dc-field{
  display:flex;flex-direction:column;gap:0.35rem;
}
.dc-label{font-size:0.75rem;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.08em}
.dc-input-row{display:flex;align-items:center;gap:0.5rem}

.dc-select{
  appearance:none;-webkit-appearance:none;
  background:var(--bg3);border:1.5px solid var(--border2);
  border-radius:var(--r-sm);
  padding:0.65rem 0.5rem;
  color:var(--text1);font-family:'JetBrains Mono',monospace;
  font-size:1rem;font-weight:600;outline:none;cursor:pointer;text-align:center;
  flex:1;max-width:100px;
  transition:border-color 0.15s,box-shadow 0.15s;
  -webkit-tap-highlight-color:transparent;
}
.dc-select:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(108,76,224,0.12);
}
.dc-select option{background:var(--bg2);color:var(--text1)}
.dc-sep{font-size:1.3rem;font-weight:700;color:var(--text3)}

/* result */
.dc-result{
  margin-top:0.6rem;padding:1rem;
  background:var(--bg);border-radius:var(--r-sm);
  display:flex;align-items:center;justify-content:space-between;
}
.dc-result-label{font-size:0.78rem;color:var(--text2);font-weight:500}
.dc-result-val{
  font-family:'JetBrains Mono',monospace;font-size:1.3rem;font-weight:800;
  color:var(--accent);
}

/* ══ NAV ARROWS ══ */
.nav-arrow{
  position:absolute;top:50%;transform:translateY(-50%);
  width:38px;height:38px;border-radius:50%;
  background:var(--bg2);border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:10;
  box-shadow:var(--shadow);
  transition:all 0.15s;font-size:0.9rem;color:var(--text2);
  -webkit-tap-highlight-color:transparent;
}
.nav-arrow:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.nav-arrow:active{transform:translateY(-50%) scale(0.92)}
.nav-arrow.left{left:0.25rem}
.nav-arrow.right{right:0.25rem}
.nav-arrow.hidden{opacity:0;pointer-events:none}

/* ══ WEEKLY SUMMARY ══ */
.summary{
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:1.3rem 1.2rem;margin-top:0;
  box-shadow:var(--shadow);
  animation:fadeUp 0.5s ease 0.2s both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.summary-title{font-size:0.9rem;font-weight:700;margin-bottom:0.9rem;color:var(--text1)}

.summary-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:0.6rem;
  margin-bottom:1rem;
}
.sg-item{
  padding:0.7rem 0.8rem;border-radius:var(--r-sm);
  background:var(--bg);
}
.sg-label{font-size:0.65rem;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.2rem}
.sg-val{font-family:'JetBrains Mono',monospace;font-size:1.15rem;font-weight:800}
.sg-val.v-accent{color:var(--accent)}
.sg-val.v-pink{color:var(--pink)}
.sg-val.v-green{color:var(--green)}
.sg-val.v-blue{color:var(--blue)}

/* progress bar */
.prog-bar{
  position:relative;height:22px;border-radius:12px;
  background:var(--bg3);overflow:visible;margin-bottom:0.5rem;
}
.prog-plan{
  position:absolute;top:0;left:0;bottom:0;border-radius:12px;
  background:repeating-linear-gradient(
    -45deg,
    rgba(108,76,224,0.13),
    rgba(108,76,224,0.13) 4px,
    rgba(108,76,224,0.06) 4px,
    rgba(108,76,224,0.06) 8px
  );
  border:1.5px dashed rgba(108,76,224,0.35);
  transition:width 0.8s cubic-bezier(0.4,0,0.2,1);
  z-index:1;
}
.prog-actual{
  position:absolute;top:0;left:0;bottom:0;border-radius:12px;
  background:linear-gradient(90deg,var(--accent),var(--blue));
  transition:width 0.8s cubic-bezier(0.4,0,0.2,1);
  z-index:2;
  box-shadow:0 2px 8px rgba(108,76,224,0.25);
}
/* 32h marker */
.prog-marker-32{
  position:absolute;top:-4px;bottom:-4px;width:2.5px;
  background:var(--pink);border-radius:2px;
  z-index:5;left:80%;/* 32/40 */
  transition:left 0.5s;
}
.prog-marker-32::after{
  content:'32h';position:absolute;top:-18px;left:50%;transform:translateX(-50%);
  font-size:0.58rem;font-weight:700;color:var(--pink);
  font-family:'JetBrains Mono',monospace;white-space:nowrap;
}
/* 32h 달성 badge */
.badge-32{
  display:none;align-items:center;gap:0.35rem;
  margin-top:0.45rem;
  padding:0.3rem 0.75rem;
  border-radius:50px;
  background:linear-gradient(135deg,#fde8e8,#ffe0f0);
  border:1px solid rgba(239,68,68,0.2);
  font-size:0.72rem;font-weight:700;color:var(--pink);
  animation:badgePop 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
  width:fit-content;
}
.badge-32.show{display:inline-flex}
@keyframes badgePop{from{opacity:0;transform:scale(0.7)}to{opacity:1;transform:scale(1)}}
.badge-32.badge-blue{background:linear-gradient(135deg,#e8f0fe,#dbeafe);border-color:rgba(59,130,246,0.2);color:var(--blue)}
.badge-32.badge-gold{background:linear-gradient(135deg,#fef3c7,#fde68a);border-color:rgba(217,180,45,0.2);color:#b45309}
.badge-32.badge-purple{background:linear-gradient(135deg,#e8e0ff,#ddd6fe);border-color:rgba(108,76,224,0.2);color:var(--accent)}

.prog-legend{
  display:flex;align-items:center;justify-content:space-between;
  font-size:0.68rem;color:var(--text3);font-family:'JetBrains Mono',monospace;
}
.prog-legend-left{display:flex;gap:0.8rem}
.pl-item{display:flex;align-items:center;gap:0.25rem}
.pl-dot{width:6px;height:6px;border-radius:2px}
.pl-dot.actual{background:var(--accent)}
.pl-dot.planned{background:repeating-linear-gradient(-45deg,rgba(108,76,224,0.3),rgba(108,76,224,0.3) 2px,transparent 2px,transparent 4px);border:1px solid var(--accent)}

/* totals breakdown */
.prog-totals{
  display:flex;flex-direction:column;gap:0.15rem;
  align-items:flex-end;
  font-family:'JetBrains Mono',monospace;
  font-size:0.68rem;color:var(--text3);
}
.prog-totals .pt-row{display:flex;align-items:center;gap:0.3rem}
.prog-totals .pt-label{font-size:0.6rem;color:var(--text2);font-family:'Outfit',sans-serif;font-weight:600}
.prog-totals .pt-val{font-weight:700}

/* predict area */
.predict-area{
  margin-top:0.8rem;padding:0.75rem 0.85rem;
  border-radius:var(--r-sm);font-size:0.8rem;line-height:1.55;
  display:flex;align-items:flex-start;gap:0.5rem;
}
.predict-area.done{background:var(--green-bg);color:var(--green)}
.predict-area.info{background:var(--accent-light);color:var(--accent)}
.predict-area .pi{font-size:1.1rem;flex-shrink:0}

/* reset btn */
.reset-row{
  display:flex;justify-content:center;margin-top:1rem;
}
.btn-reset{
  padding:0.5rem 1.2rem;border:1px solid var(--border2);border-radius:50px;
  background:var(--bg2);color:var(--text2);font-family:'Outfit',sans-serif;
  font-size:0.78rem;font-weight:600;cursor:pointer;
  transition:all 0.15s;-webkit-tap-highlight-color:transparent;
}
.btn-reset:hover{background:var(--pink-bg);color:var(--pink);border-color:var(--pink)}

/* per-day reset */
.dc-day-reset{
  display:inline-flex;align-items:center;gap:0.25rem;
  margin-top:0.5rem;padding:0.3rem 0.75rem;
  border:1px solid var(--border);border-radius:50px;
  background:var(--bg);color:var(--text3);font-family:'Outfit',sans-serif;
  font-size:0.68rem;font-weight:600;cursor:pointer;
  transition:all 0.15s;-webkit-tap-highlight-color:transparent;
}
.dc-day-reset:hover{background:var(--pink-bg);color:var(--pink);border-color:var(--pink)}
.dc-day-reset:active{transform:scale(0.95)}

/* business trip toggle */
.dc-top-actions{display:flex;gap:0.6rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.biz-toggle-wrap{
  display:flex;align-items:center;gap:0.55rem;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  user-select:none;
}
.biz-toggle-label{
  font-size:0.78rem;font-weight:700;color:var(--text2);
  font-family:'Outfit',sans-serif;
  transition:color 0.25s;
}
.biz-toggle-wrap.active .biz-toggle-label{color:var(--blue)}
.biz-slider{
  position:relative;width:46px;height:26px;
  background:var(--bg3);border:1.5px solid var(--border2);
  border-radius:50px;
  transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
  flex-shrink:0;
}
.biz-slider::after{
  content:'';position:absolute;top:2px;left:2px;
  width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,0.15);
  transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
}
.biz-toggle-wrap.active .biz-slider{
  background:var(--blue);border-color:var(--blue);
  box-shadow:0 2px 10px rgba(59,130,246,0.3);
}
.biz-toggle-wrap.active .biz-slider::after{
  transform:translateX(20px);
}
.biz-toggle-status{
  font-size:0.65rem;font-weight:600;color:var(--text3);
  font-family:'JetBrains Mono',monospace;
  transition:color 0.25s;
}
.biz-toggle-wrap.active .biz-toggle-status{color:var(--blue)}

/* disabled fields when biz trip is on */
.dc-fields.disabled{opacity:0.45;pointer-events:none;filter:grayscale(0.3)}

/* friday early-leave info */
.fri-leave-info{
  margin-top:0.6rem;padding:0.8rem 0.9rem;
  border-radius:var(--r-sm);
  background:linear-gradient(135deg,#e8faf0,#dbeafe);
  border:1.5px solid rgba(34,197,94,0.25);
  font-size:0.82rem;font-weight:600;color:var(--green);
  line-height:1.5;
  display:flex;align-items:flex-start;gap:0.5rem;
  animation:badgePop 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
}
.fri-leave-info .fri-icon{font-size:1.3rem;flex-shrink:0}
.fri-leave-info .fri-time{
  font-family:'JetBrains Mono',monospace;font-size:1.1rem;font-weight:800;
  color:#16a34a;
}
.fri-leave-info.not-ready{
  background:var(--accent-light);border-color:rgba(108,76,224,0.2);
  color:var(--accent);
}

/* ══ TOAST ══ */
.toast{
  position:fixed;bottom:1.5rem;left:50%;
  transform:translateX(-50%) translateY(80px);
  background:var(--text1);color:var(--bg);
  border-radius:50px;padding:0.6rem 1.3rem;
  font-size:0.82rem;font-weight:600;
  z-index:999;transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1),opacity 0.3s;
  opacity:0;pointer-events:none;white-space:nowrap;
  box-shadow:var(--shadow-lg);
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

footer{text-align:center;color:var(--text3);font-size:0.7rem;margin-top:1.5rem;padding-bottom:1rem}

/* ══ RESPONSIVE ══ */
@media(min-width:769px){
  .carousel-wrap{margin:0;padding:0 1rem}
  .carousel-wrap::before,.carousel-wrap::after{display:none}
}
@media(max-width:768px){
  .app{max-width:480px;padding:0 0.75rem 3rem}
  .main-content{flex-direction:column;align-items:center}
  .main-left{width:100%}
  .main-right{width:100%;position:static}
  .summary{margin-top:1.2rem}
  .carousel-wrap{margin:0 -0.75rem;padding:0 0.75rem}
  .carousel-wrap::before,.carousel-wrap::after{width:1.5rem}
  .prog-legend{flex-direction:column;gap:0.45rem;align-items:flex-start}
  .prog-totals{align-items:flex-start}
  .predict-area{flex-direction:row;flex-wrap:wrap}
}
@media(min-width:520px){
  .logo-img{height:160px}
  .header h1{font-size:1.8rem}
  .day-card-inner{padding:2rem 1.8rem}
  .dc-day-name{font-size:1.7rem}
}
@media(max-width:420px){
  .logo-img{height:105px}
  .header h1{font-size:1.25rem}
  .header p{font-size:0.75rem}
  .dc-day-name{font-size:1.2rem}
  .day-card-inner{padding:1.1rem 0.9rem}
  .dc-select{padding:0.55rem 0.35rem;font-size:0.88rem;max-width:85px}
  .dc-sep{font-size:1.1rem}
  .summary{padding:1rem 0.9rem}
  .summary-grid{gap:0.4rem}
  .sg-val{font-size:1rem}
  .sg-label{font-size:0.6rem}
  .clock-row{padding:0.4rem 0.8rem;gap:0.4rem}
  #clock-display{font-size:0.92rem}
  #date-display{font-size:0.65rem}
  .day-dot{width:34px;height:34px;font-size:0.65rem}
  .predict-area{font-size:0.73rem;padding:0.6rem 0.7rem}
  .dc-result-val{font-size:1.1rem}
  .nav-arrow{width:32px;height:32px;font-size:0.8rem}
  .dc-day-reset{font-size:0.62rem;padding:0.25rem 0.6rem}
  .prog-bar{height:18px}
  .prog-marker-32::after{font-size:0.52rem;top:-16px}
  .badge-32{font-size:0.65rem;padding:0.25rem 0.6rem}
  .btn-reset{font-size:0.72rem;padding:0.4rem 1rem}
}
</style>
</head>
<body>

<!-- CREDIT BAR -->
<div class="credit-bar">
  <span>By</span>
  <span class="cn">이윤재</span>
  <span class="cr">AI PM 인턴</span>
  <span class="cd">😇 업무시간에 만든거 아님</span>
</div>

<div class="app">

  <!-- HEADER -->
  <header class="header">
    <img class="logo-img" src="jj라이언~.svg" alt="라이언" onerror="this.style.display='none'"/>
    <h1>이제 <span>퇴근해도 돼?</span></h1>
    <p>현명하게 일하고 제때 퇴근하세요</p>
    <div class="clock-row">
      <div class="live-dot"></div>
      <span id="clock-display">00:00:00</span>
      <span id="date-display">로딩 중...</span>
    </div>
  </header>

  <div class="main-content">
    <div class="main-left">
      <!-- DAY NAV DOTS -->
      <nav class="day-nav" id="day-nav"></nav>

      <!-- CAROUSEL -->
      <div class="carousel-wrap">
        <div class="nav-arrow left" id="nav-left">‹</div>
        <div class="nav-arrow right" id="nav-right">›</div>
        <div class="carousel-track" id="carousel-track"></div>
      </div>
    </div>

    <div class="main-right">
      <!-- WEEKLY SUMMARY -->
      <div class="summary">
        <div class="summary-title">📊 주간 요약</div>
        <div class="summary-grid">
          <div class="sg-item"><div class="sg-label">실 근무</div><div class="sg-val v-accent" id="st-worked">0h</div></div>
          <div class="sg-item"><div class="sg-label">실근무 + 예상</div><div class="sg-val v-blue" id="st-total-plan">0h</div></div>
          <div class="sg-item"><div class="sg-label">남은 시간</div><div class="sg-val v-pink" id="st-remain">40h</div></div>
          <div class="sg-item"><div class="sg-label">차감 휴게</div><div class="sg-val v-green" id="st-break">0h</div></div>
          <div class="sg-item"><div class="sg-label">달성률 (실근무)</div><div class="sg-val v-blue" id="st-pct">0%</div></div>
          <div class="sg-item"><div class="sg-label">달성률 (+ 예상)</div><div class="sg-val v-blue" id="st-pct-plan">0%</div></div>
        </div>
        <div class="prog-bar">
          <div class="prog-plan" id="prog-plan"></div>
          <div class="prog-actual" id="prog-actual"></div>
          <div class="prog-marker-32"></div>
        </div>
        <div class="prog-legend">
          <div class="prog-legend-left">
            <span class="pl-item"><span class="pl-dot actual"></span><span id="leg-a">0h</span> 실근무</span>
            <span class="pl-item"><span class="pl-dot planned"></span><span id="leg-p">—</span> 예상</span>
          </div>
          <div class="prog-totals">
            <div class="pt-row"><span class="pt-label">40h 기준</span> <span class="pt-val" id="leg-total-40">0h / 40h</span></div>
            <div class="pt-row"><span class="pt-label">32h 기준</span> <span class="pt-val" id="leg-total-32">0h / 32h</span></div>
          </div>
        </div>
        <div class="badge-32" id="badge-32">🔥 32시간 달성!</div>
        <div id="predict-area"></div>
      </div>
    </div>
  </div>

  <div class="reset-row">
    <button class="btn-reset" id="btn-reset">초기화</button>
  </div>

  <footer>💜 퇴근해 트래커 · 현명하게 일하고 제때 퇴근하세요</footer>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════ HELPERS ═══════════ */
const TARGET=40, DAYS_KO=['일','월','화','수','목','금','토'], DAYS_FULL=['월요일','화요일','수요일','목요일','금요일'], STORE='gohome-v5';
const pad=n=>String(n).padStart(2,'0');
const calcBreak=g=>g<=0?0:Math.floor(g/4)*0.5;
const netHrs=g=>Math.max(0,g-calcBreak(g));
function fmtHr(h){if(h==null||isNaN(h)||h<0)return'—';if(h===0)return'0h';const totalMin=Math.round(h*60),w=Math.floor(totalMin/60),m=totalMin%60;return m===0?`${w}h`:`${w}h ${pad(m)}m`;}
function timeDecimal(s){if(!s)return null;const[h,m]=s.split(':').map(Number);return h+m/60;}
function getMonday(d){const dt=new Date(d),day=dt.getDay();dt.setDate(dt.getDate()+(day===0?-6:1-day));dt.setHours(0,0,0,0);return dt;}
function loadData(){try{return JSON.parse(localStorage.getItem(STORE))||{};}catch{return{};}}
function saveData(d){localStorage.setItem(STORE,JSON.stringify(d));}

/* ═══════════ CLOCK ═══════════ */
function tick(){
  const now=new Date(),h=now.getHours(),m=now.getMinutes(),s=now.getSeconds();
  const ampm=h>=12?'오후':'오전',h12=h%12||12;
  document.getElementById('clock-display').textContent=`${pad(h12)}:${pad(m)}:${pad(s)}`;
  const yr=now.getFullYear(),mo=now.getMonth()+1,da=now.getDate();
  document.getElementById('date-display').textContent=`${mo}/${da} (${DAYS_KO[now.getDay()]}) ${ampm}`;
}
tick();setInterval(tick,1000);

/* ═══════════ WEEK (live-updating) ═══════════ */
let monday=getMonday(new Date());
let weekDays=Array.from({length:5},(_,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);return d;});
let currentIndex=0;

function recalcWeek(){
  monday=getMonday(new Date());
  weekDays=Array.from({length:5},(_,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);return d;});
  currentIndex=0;
  weekDays.forEach((d,i)=>{if(dayStatus(i)==='today')currentIndex=i;});
}

function dayStatus(i){
  const d=new Date(weekDays[i]);d.setHours(0,0,0,0);
  const now=new Date();now.setHours(0,0,0,0);
  if(d<now)return'past';if(d.getTime()===now.getTime())return'today';return'future';
}

/* find today's index on first load */
weekDays.forEach((d,i)=>{if(dayStatus(i)==='today')currentIndex=i;});

/* ═══════════ AUTO-REFRESH ═══════════ */
/* Track the current date so we detect day changes (midnight, sleep/wake, etc.) */
let _lastDateStr=(()=>{const n=new Date();return `${n.getFullYear()}-${n.getMonth()}-${n.getDate()}`;})();

function fullRefresh(){
  recalcWeek();
  buildDots();
  buildCarousel();
  updateStats();
}

function checkDateChange(){
  const n=new Date(), ds=`${n.getFullYear()}-${n.getMonth()}-${n.getDate()}`;
  if(ds!==_lastDateStr){
    _lastDateStr=ds;
    fullRefresh();
  }
}

/* Check every 30 seconds if the date has changed */
setInterval(checkDateChange,30000);

/* Also refresh when the tab becomes visible again (coming back after sleep, etc.) */
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){
    tick(); /* update clock immediately */
    checkDateChange(); /* check if day rolled over */
    updateStats(); /* recalc stats in case anything is stale */
  }
});

/* ═══════════ TIME PICKER ═══════════ */
const START_HOURS=[8,9,10], END_HOURS=[16,17,18,19,20,21,22,23];
function makeSelect(savedVal, role, onChange){
  const hours=role==='start'?START_HOURS:END_HOURS;
  const defaultH=hours[0];
  let initH='',initM='';
  if(savedVal){const p=savedVal.split(':').map(Number);initH=hours.includes(p[0])?p[0]:defaultH;initM=p[1];}

  const wrap=document.createElement('div');
  wrap.className='dc-input-row';

  const hSel=document.createElement('select');
  hSel.className='dc-select';
  hSel.innerHTML='<option value="">--</option>';
  hours.forEach(h=>{const o=document.createElement('option');o.value=h;o.textContent=pad(h);hSel.appendChild(o);});
  hSel.value=initH;

  const sep=document.createElement('span');
  sep.className='dc-sep';sep.textContent=':';

  const mSel=document.createElement('select');
  mSel.className='dc-select';
  mSel.innerHTML='<option value="">--</option>';
  for(let i=0;i<60;i++){const o=document.createElement('option');o.value=i;o.textContent=pad(i);mSel.appendChild(o);}
  mSel.value=initM;

  function fire(){
    let h=hSel.value,m=mSel.value;
    if(h!==''&&m===''){m=0;mSel.value=m;}
    if(h===''&&m!==''){h=defaultH;hSel.value=h;}
    if(h!==''&&m!==''){onChange(`${pad(parseInt(h))}:${pad(parseInt(m))}`);}
    else{onChange(null);}
  }
  hSel.addEventListener('change',fire);
  mSel.addEventListener('change',fire);

  wrap.append(hSel,sep,mSel);
  return wrap;
}

/* ═══════════ COMPUTE ═══════════ */
function computeDay(dd,st){
  if(st==='future'){
    if(!dd.fstart||!dd.fend)return{gross:null,net:null};
    const g=timeDecimal(dd.fend)-timeDecimal(dd.fstart);
    return g>0?{gross:g,net:netHrs(g)}:{gross:null,net:null};
  }
  if(!dd.start||!dd.end)return{gross:null,net:null};
  const g=timeDecimal(dd.end)-timeDecimal(dd.start);
  return g>0?{gross:g,net:netHrs(g)}:{gross:null,net:null};
}

/* ═══════════ BUILD CAROUSEL ═══════════ */
function buildCarousel(){
  const data=loadData();
  const track=document.getElementById('carousel-track');
  track.innerHTML='';

  weekDays.forEach((d,i)=>{
    const st=dayStatus(i), dd=data[`day-${i}`]||{};
    const {gross,net}=computeDay(dd,st);
    const mo=d.getMonth()+1,da=d.getDate();

    const card=document.createElement('div');
    card.className='day-card';

    let statusCls=st, statusTxt='';
    if(st==='past'){statusTxt='✓ 완료';}
    else if(st==='today'){statusTxt='● 오늘';}
    else{statusTxt='○ 예정';}

    const isBizTrip=!!dd.bizTrip;
    card.innerHTML=`
      <div class="day-card-inner">
        <div class="dc-header">
          <div>
            <div class="dc-day-name">${DAYS_FULL[i]}</div>
            <div class="dc-date">${mo}월 ${da}일</div>
          </div>
          <span class="dc-status ${statusCls}">${statusTxt}</span>
        </div>
        <div class="dc-top-actions">
          <div class="biz-toggle-wrap${isBizTrip?' active':''}" id="biz-toggle-${i}" onclick="toggleBusinessTrip(${i})">
            <div class="biz-slider"></div>
            <span class="biz-toggle-label">출장/외근</span>
            <span class="biz-toggle-status">${isBizTrip?'9-18 적용':'OFF'}</span>
          </div>
        </div>
        <div class="dc-fields${isBizTrip?' disabled':''}" id="fields-${i}">
          <div class="dc-field">
            <label class="dc-label">출근 시간</label>
            <div id="start-sel-${i}"></div>
          </div>
          <div class="dc-field">
            <label class="dc-label">${st==='today'?'예상 퇴근 시간':'퇴근 시간'}</label>
            <div id="end-sel-${i}"></div>
          </div>
          <div class="dc-result">
            <span class="dc-result-label">인정 근무시간</span>
            <span class="dc-result-val" id="result-${i}">${net?fmtHr(net):'—'}</span>
          </div>
          <div id="fri-info-${i}"></div>
          <button class="dc-day-reset" onclick="resetDay(${i})">↺ 이 날 초기화</button>
        </div>
      </div>`;

    track.appendChild(card);

    // inject time selects after DOM insert
    setTimeout(()=>{
      const startWrap=document.getElementById(`start-sel-${i}`);
      const endWrap=document.getElementById(`end-sel-${i}`);
      if(startWrap){
        startWrap.appendChild(makeSelect(
          st==='future'?(dd.fstart||null):(dd.start||null), 'start',
          str=>{saveDayField(i,st==='future'?'fstart':'start',str);refreshCard(i);updateStats();}
        ));
      }
      if(endWrap){
        endWrap.appendChild(makeSelect(
          st==='future'?(dd.fend||null):(dd.end||null), 'end',
          str=>{saveDayField(i,st==='future'?'fend':'end',str);refreshCard(i);updateStats();}
        ));
      }
    },0);
  });

  slideTo(currentIndex,false);
}

function refreshCard(i){
  const data=loadData(),dd=data[`day-${i}`]||{},st=dayStatus(i);
  const {net}=computeDay(dd,st);
  const el=document.getElementById(`result-${i}`);
  if(el) el.textContent=net?fmtHr(net):'—';
  updateFridayInfo(i);
}

/* ═══════════ NAVIGATION ═══════════ */
function slideTo(idx,animate=true){
  currentIndex=idx;
  const track=document.getElementById('carousel-track');
  track.style.transition=animate?'transform 0.45s cubic-bezier(0.4,0,0.2,1)':'none';
  track.style.transform=`translateX(-${idx*100}%)`;

  // update dots
  document.querySelectorAll('.day-dot').forEach((dot,i)=>{
    dot.classList.toggle('active',i===idx);
  });

  // update arrows
  document.getElementById('nav-left').classList.toggle('hidden',idx===0);
  document.getElementById('nav-right').classList.toggle('hidden',idx===4);
}

function buildDots(){
  const nav=document.getElementById('day-nav');
  nav.innerHTML='';
  const abbr=['월','화','수','목','금'];
  weekDays.forEach((_,i)=>{
    const dot=document.createElement('div');
    dot.className='day-dot';
    const st=dayStatus(i);
    if(st==='past')dot.classList.add('done');
    dot.textContent=abbr[i];
    dot.addEventListener('click',()=>slideTo(i));
    nav.appendChild(dot);
  });
}

document.getElementById('nav-left').addEventListener('click',()=>{if(currentIndex>0)slideTo(currentIndex-1);});
document.getElementById('nav-right').addEventListener('click',()=>{if(currentIndex<4)slideTo(currentIndex+1);});

// swipe support
let touchX=null;
document.getElementById('carousel-track').addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;},{passive:true});
document.getElementById('carousel-track').addEventListener('touchend',e=>{
  if(touchX===null)return;
  const dx=e.changedTouches[0].clientX-touchX;
  if(Math.abs(dx)>50){
    if(dx<0&&currentIndex<4)slideTo(currentIndex+1);
    else if(dx>0&&currentIndex>0)slideTo(currentIndex-1);
  }
  touchX=null;
},{passive:true});

// keyboard
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'&&currentIndex>0){slideTo(currentIndex-1);e.preventDefault();}
  if(e.key==='ArrowRight'&&currentIndex<4){slideTo(currentIndex+1);e.preventDefault();}
});

/* ═══════════ STATS ═══════════ */
function computeAll(){
  const data=loadData();
  let workedNet=0,workedBreak=0,plannedNet=0;
  weekDays.forEach((_,i)=>{
    const st=dayStatus(i),dd=data[`day-${i}`]||{};
    const{gross,net}=computeDay(dd,st);
    if(gross==null)return;
    if(st==='future'){plannedNet+=net||0;}
    else{workedNet+=net||0;workedBreak+=calcBreak(gross);}
  });
  return{workedNet,workedBreak,plannedNet};
}

function updateStats(){
  const{workedNet,workedBreak,plannedNet}=computeAll();
  const total=workedNet+plannedNet;
  const pct=Math.min(100,(workedNet/TARGET)*100);
  const pctPlan=Math.min(100,(total/TARGET)*100);
  const remain=Math.max(0,TARGET-workedNet);
  const TARGET32=32;

  document.getElementById('st-worked').textContent=fmtHr(workedNet);
  document.getElementById('st-total-plan').textContent=fmtHr(total);
  document.getElementById('st-remain').textContent=fmtHr(remain);
  document.getElementById('st-break').textContent=fmtHr(workedBreak);
  document.getElementById('st-pct').textContent=`${Math.round(pct)}%`;
  document.getElementById('st-pct-plan').textContent=`${Math.round(pctPlan)}%`;
  document.getElementById('prog-actual').style.width=pct+'%';
  document.getElementById('prog-plan').style.width=pctPlan+'%';
  document.getElementById('leg-a').textContent=fmtHr(workedNet);
  document.getElementById('leg-p').textContent=plannedNet>0?fmtHr(plannedNet):'—';
  document.getElementById('leg-total-40').textContent=`${fmtHr(total)} / 40h`;
  document.getElementById('leg-total-32').textContent=`${fmtHr(total)} / 32h`;

  // Milestone badge - show only the HIGHEST achieved milestone
  const badge32=document.getElementById('badge-32');
  if(workedNet>=TARGET){
    badge32.className='badge-32 show badge-gold';
    badge32.innerHTML='🏆 실근무 40시간 달성!';
  } else if(total>=TARGET){
    badge32.className='badge-32 show badge-blue';
    badge32.innerHTML='🎯 실근무 + 예상시 40시간 달성!';
  } else if(workedNet>=TARGET32){
    badge32.className='badge-32 show';
    badge32.innerHTML='🔥 실근무 32시간 달성!';
  } else if(total>=TARGET32){
    badge32.className='badge-32 show badge-purple';
    badge32.innerHTML='✨ 실근무 + 예상시 32시간 달성!';
  } else {
    badge32.className='badge-32';
  }

  const area=document.getElementById('predict-area');
  const need32=Math.max(0,TARGET32-total), need40=Math.max(0,TARGET-total);
  if(workedNet>=TARGET){
    area.className='predict-area done';
    area.innerHTML=`<span class="pi">🏠</span><div><strong>완료! 이제 퇴근해도 됩니다!</strong><br><span style="font-size:0.75rem">수고하셨어요 🎉</span></div>`;
  } else if(plannedNet>0){
    area.className='predict-area info';
    let msg='';
    if(total>=TARGET){
      msg=`<span class="pi">🎯</span><div>예정대로 하면 <strong>${fmtHr(total)}</strong> 달성! ✓</div>`;
    } else if(total>=TARGET32){
      msg=`<span class="pi">📊</span><div>예정대로 하면 <strong>${fmtHr(total)}</strong>로 32h 달성!<br>40시간을 채우려면 <strong style="color:var(--pink)">${fmtHr(need40)}</strong> 더 필요해요.</div>`;
    } else {
      msg=`<span class="pi">📊</span><div>예정대로 하면 <strong>${fmtHr(total)}</strong> 채워져요.<br>32시간까지 <strong style="color:var(--pink)">${fmtHr(need32)}</strong>, 40시간까지 <strong style="color:var(--pink)">${fmtHr(need40)}</strong> 더 필요.</div>`;
    }
    area.innerHTML=msg;
  } else {
    area.className='predict-area info';
    const rNeed32=Math.max(0,TARGET32-workedNet), rNeed40=Math.max(0,TARGET-workedNet);
    let msg='';
    if(workedNet>=TARGET32){
      msg=`<span class="pi">💡</span><div>32시간 달성! 40시간까지 <strong>${fmtHr(rNeed40)}</strong> 남았습니다.</div>`;
    } else {
      msg=`<span class="pi">💡</span><div>32시간까지 <strong>${fmtHr(rNeed32)}</strong>, 40시간까지 <strong>${fmtHr(rNeed40)}</strong> 남았습니다.<br><span style="font-size:0.75rem">예정 시간을 입력해보세요!</span></div>`;
    }
    area.innerHTML=msg;
  }
}

/* ═══════════ DATA ═══════════ */
function saveDayField(i,field,val){
  const data=loadData();
  if(!data[`day-${i}`])data[`day-${i}`]={};
  if(!val)delete data[`day-${i}`][field];
  else data[`day-${i}`][field]=val;
  saveData(data);
}

function resetDay(i){
  const dayNames=['월요일','화요일','수요일','목요일','금요일'];
  if(!confirm(`${dayNames[i]} 입력을 초기화할까요?`))return;
  const data=loadData();
  delete data[`day-${i}`];
  saveData(data);
  buildCarousel();updateStats();
  showToast(`${dayNames[i]} 초기화 완료`);
}

/* ═══════════ BUSINESS TRIP TOGGLE (출장/외근) ═══════════ */
function toggleBusinessTrip(i){
  const data=loadData();
  const st=dayStatus(i);
  if(!data[`day-${i}`])data[`day-${i}`]={};
  const dd=data[`day-${i}`];
  const isOn=!!dd.bizTrip;

  if(isOn){
    // Toggle OFF — restore previously saved values
    delete dd.bizTrip;
    if(st==='future'){
      if(dd._saved_fstart){dd.fstart=dd._saved_fstart;delete dd._saved_fstart;}
      else{delete dd.fstart;}
      if(dd._saved_fend){dd.fend=dd._saved_fend;delete dd._saved_fend;}
      else{delete dd.fend;}
    } else {
      if(dd._saved_start){dd.start=dd._saved_start;delete dd._saved_start;}
      else{delete dd.start;}
      if(dd._saved_end){dd.end=dd._saved_end;delete dd._saved_end;}
      else{delete dd.end;}
    }
    saveData(data);
    buildCarousel();updateStats();
    showToast(`${DAYS_FULL[i]} 출장/외근 해제`);
  } else {
    // Toggle ON — save current values, then set 9-18
    if(st==='future'){
      if(dd.fstart)dd._saved_fstart=dd.fstart;
      if(dd.fend)dd._saved_fend=dd.fend;
      dd.fstart='09:00';dd.fend='18:00';
    } else {
      if(dd.start)dd._saved_start=dd.start;
      if(dd.end)dd._saved_end=dd.end;
      dd.start='09:00';dd.end='18:00';
    }
    dd.bizTrip=true;
    saveData(data);
    buildCarousel();updateStats();
    showToast(`${DAYS_FULL[i]} 출장/외근 (9-18) 적용 완료`);
  }
}

/* ═══════════ FRIDAY EARLY-LEAVE CALC ═══════════ */
function updateFridayInfo(i){
  // Only show on Friday card (index 4)
  if(i!==4)return;
  const container=document.getElementById(`fri-info-${i}`);
  if(!container)return;

  const data=loadData();
  const st=dayStatus(4);
  const dd=data['day-4']||{};

  // Get Mon-Thu actual worked net hours
  let monThuNet=0;
  for(let d=0;d<4;d++){
    const dst=dayStatus(d),ddd=data[`day-${d}`]||{};
    const{net}=computeDay(ddd,dst);
    if(net)monThuNet+=net;
  }

  // Get Friday start time
  const friStart=st==='future'?dd.fstart:dd.start;

  if(!friStart){
    // No start time entered for Friday
    const remainFor40=Math.max(0,TARGET-monThuNet);
    if(monThuNet>0){
      container.innerHTML=`<div class="fri-leave-info not-ready">
        <span class="fri-icon">📝</span>
        <div>월~목 실근무: <strong>${fmtHr(monThuNet)}</strong><br>
        금요일 출근 시간을 입력하면 <strong>퇴근 가능 시간</strong>을 알려드릴게요!</div>
      </div>`;
    } else {
      container.innerHTML='';
    }
    return;
  }

  const friStartDec=timeDecimal(friStart);
  const remainFor40=Math.max(0,TARGET-monThuNet);

  // Calculate how many gross hours needed on Friday to get remainFor40 net hours
  // net = gross - break, break = floor(gross/4)*0.5
  // Iterate in 1-minute increments for accuracy
  let neededGross=remainFor40;
  for(let tryMin=Math.floor(remainFor40*60);tryMin<=900;tryMin++){
    const tryGross=tryMin/60;
    if(netHrs(tryGross)>=remainFor40-0.001){
      neededGross=tryGross;
      break;
    }
  }

  const leaveTimeDec=friStartDec+neededGross;
  const leaveH=Math.floor(leaveTimeDec);
  const leaveM=Math.round((leaveTimeDec-leaveH)*60);
  const leaveStr=`${pad(leaveH)}:${pad(leaveM)}`;

  if(leaveTimeDec>24){
    container.innerHTML=`<div class="fri-leave-info not-ready">
      <span class="fri-icon">😅</span>
      <div>월~목 근무: <strong>${fmtHr(monThuNet)}</strong><br>
      금요일에 <strong>${fmtHr(remainFor40)}</strong> 더 필요한데... 하루에 채우기 힘들어요 ㅠ</div>
    </div>`;
    return;
  }

  container.innerHTML=`<div class="fri-leave-info">
    <span class="fri-icon">🚀</span>
    <div>월~목 근무: <strong>${fmtHr(monThuNet)}</strong><br>
    40시간 채우려면 <span class="fri-time">${leaveStr}</span> 에 퇴근해도 돼!<br>
    <span style="font-size:0.72rem;color:#16a34a;opacity:0.8">(금요일 필요: ${fmtHr(remainFor40)}, 휴게 포함 ${fmtHr(neededGross)})</span></div>
  </div>`;
}

/* Update all Friday info on stats update */
const _origUpdateStats=updateStats;
updateStats=function(){
  _origUpdateStats.apply(this,arguments);
  updateFridayInfo(4);
};

document.getElementById('btn-reset').addEventListener('click',()=>{
  if(!confirm('이번 주 입력 내용을 모두 초기화할까요?'))return;
  localStorage.removeItem(STORE);
  buildCarousel();updateStats();
  showToast('초기화되었습니다');
});

function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);
}

/* ═══════════ INIT ═══════════ */
buildDots();
buildCarousel();
updateStats();
</script>
