<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>퇴근해 · 주간 근무 트래커</title>
<meta name="description" content="주간 근무 시간을 추적하고 정확한 퇴근 시간을 확인하세요."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0b0f;--bg2:#111117;--bg3:#16161e;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text1:#e8e8f0;--text2:#7a7a96;--text3:#a0a0c0;
  --accent:#7c5cfc;--cyan:#00d4ff;--green:#00e5a0;
  --pink:#ff4d8d;--yellow:#ffd93d;--orange:#ff8c42;
  --r:12px;--r-sm:8px;
}
html{font-size:16px}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text1);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:0.45;}
.glow-a{position:fixed;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(124,92,252,0.1),transparent 70%);top:-180px;left:-180px;pointer-events:none;z-index:0}
.glow-b{position:fixed;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(0,212,255,0.07),transparent 70%);bottom:-120px;right:-80px;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:1.5rem 1rem 4rem}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.8rem;padding-bottom:1.2rem;border-bottom:1px solid var(--border);animation:fadeDown 0.5s ease both;gap:1rem;flex-wrap:wrap;}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.header-left{display:flex;align-items:center;gap:1rem}
.logo-img{height:88px;width:auto;filter:drop-shadow(0 0 16px rgba(124,92,252,0.42));animation:lionFloat 4s ease-in-out infinite;flex-shrink:0;}
@keyframes lionFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-6px) rotate(1deg)}}
.header-title h1{font-size:1.5rem;font-weight:800;letter-spacing:-0.03em;line-height:1.15}
.header-title h1 span{background:linear-gradient(90deg,#7c5cfc,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.header-title p{font-size:0.8rem;color:var(--text2);margin-top:0.2rem}
.header-right{display:flex;flex-direction:column;align-items:flex-end;gap:0.15rem}
.live-badge{display:flex;align-items:center;gap:0.35rem;font-size:0.67rem;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;color:var(--green);background:rgba(0,229,160,0.07);border:1px solid rgba(0,229,160,0.22);padding:0.18rem 0.5rem;border-radius:50px;}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.8)}}
#clock-display{font-family:'JetBrains Mono',monospace;font-size:1.7rem;font-weight:700;letter-spacing:-0.02em;background:linear-gradient(90deg,#00d4ff,#7c5cfc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
#date-display{font-size:0.76rem;color:var(--text3);font-family:'JetBrains Mono',monospace}

/* SECTION LABEL */
.sec-label{font-size:0.67rem;font-weight:700;text-transform:uppercase;letter-spacing:0.14em;color:var(--text2);display:flex;align-items:center;gap:0.5rem;margin-bottom:0.85rem;}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* DESKTOP TABLE */
.week-table-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:1.2rem;animation:fadeUp 0.5s ease 0.1s both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.week-table-header{display:grid;grid-template-columns:80px repeat(5,1fr);background:var(--bg3);border-bottom:1px solid var(--border);}
.wth-cell{padding:0.65rem 0.35rem;text-align:center;border-right:1px solid var(--border);font-size:0.72rem;font-weight:600;color:var(--text2);}
.wth-cell:first-child{text-align:left;padding-left:0.75rem}
.wth-cell:last-child{border-right:none}
.wth-cell .dn{font-weight:700;color:var(--text3);font-size:0.78rem}
.wth-cell.t-col .dn{color:var(--cyan)}
.today-badge{display:inline-block;background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.3);color:var(--cyan);font-size:0.58rem;font-weight:700;padding:0.1rem 0.38rem;border-radius:4px;margin-top:0.18rem;}
.week-row-dt{display:grid;grid-template-columns:80px repeat(5,1fr);border-bottom:1px solid var(--border);transition:background 0.12s;}
.week-row-dt:last-child{border-bottom:none}
.week-row-dt:hover{background:rgba(255,255,255,0.01)}
.rl{padding:0.5rem 0.3rem 0.5rem 0.75rem;font-size:0.72rem;color:var(--text2);border-right:1px solid var(--border);display:flex;align-items:center;font-weight:500;}
.dc{padding:0.3rem 0.22rem;border-right:1px solid var(--border);display:flex;align-items:center;justify-content:center;min-height:38px;font-size:0.78rem;}
.dc:last-child{border-right:none}

/* TIME PICKER */
.time-picker,.time-picker-lg{display:flex;align-items:center;gap:2px;justify-content:center}
.tp-sel{appearance:none;-webkit-appearance:none;background:rgba(255,255,255,0.06);border:1px solid var(--border2);border-radius:6px;padding:0.22rem 0.15rem;color:var(--text1);font-family:'JetBrains Mono',monospace;font-size:0.74rem;font-weight:500;outline:none;cursor:pointer;text-align:center;transition:border-color 0.12s,background 0.12s;}
.tp-sel:hover{background:rgba(255,255,255,0.09)}
.tp-sel:focus{border-color:rgba(124,92,252,0.6);box-shadow:0 0 0 2px rgba(124,92,252,0.12);background:rgba(124,92,252,0.06)}
.tp-sel option,.tp-sel-lg option{background:#1a1a24;color:#e8e8f0;}
.tp-sep{color:var(--text2);font-family:'JetBrains Mono',monospace;font-size:0.82rem;margin:0 1px}
.tp-sel.future-tp{border-color:rgba(124,92,252,0.3)}
.tp-sel.future-tp:focus{border-color:rgba(124,92,252,0.65)}

/* MINUTE SPINNER */
.min-spin{
  position:relative;
  display:inline-flex;flex-direction:column;align-items:center;
  background:rgba(255,255,255,0.06);border:1px solid var(--border2);
  border-radius:6px;overflow:hidden;cursor:ns-resize;
  user-select:none;-webkit-user-select:none;
  touch-action:none;
  transition:border-color 0.12s,background 0.12s;
}
.min-spin:hover{background:rgba(255,255,255,0.09)}
.min-spin.focused{border-color:rgba(124,92,252,0.6);box-shadow:0 0 0 2px rgba(124,92,252,0.12);background:rgba(124,92,252,0.06)}
.min-spin.future-tp{border-color:rgba(124,92,252,0.3)}
.min-spin-btn{
  width:100%;display:flex;align-items:center;justify-content:center;
  color:var(--text2);font-size:0.5rem;line-height:1;
  padding:0.12rem 0;transition:color 0.1s,background 0.1s;
  cursor:pointer;
}
.min-spin-btn:hover{color:var(--text1);background:rgba(255,255,255,0.06)}
.min-spin-val{
  font-family:'JetBrains Mono',monospace;font-weight:500;color:var(--text1);
  padding:0.05rem 0.15rem;line-height:1;
  pointer-events:none;
}
.min-spin-lg{
  border-radius:8px;
}
.min-spin-lg .min-spin-btn{font-size:0.6rem;padding:0.14rem 0}


/* STATUS PILLS */
.status-pill{display:inline-flex;align-items:center;gap:0.22rem;font-size:0.64rem;font-weight:700;padding:0.16rem 0.5rem;border-radius:50px;letter-spacing:0.04em;white-space:nowrap;}
.pill-done{background:rgba(0,229,160,0.1);border:1px solid rgba(0,229,160,0.3);color:var(--green)}
.pill-today{background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.4);color:var(--cyan);animation:todayGlow 2s ease-in-out infinite}
@keyframes todayGlow{0%,100%{box-shadow:0 0 0 0 rgba(0,212,255,0)}50%{box-shadow:0 0 5px 1px rgba(0,212,255,0.15)}}
.pill-plan{background:rgba(124,92,252,0.1);border:1px solid rgba(124,92,252,0.3);color:#a688ff}

/* MOBILE CARDS */
.week-cards{display:none;flex-direction:column;gap:0.75rem;margin-bottom:1.2rem}
.day-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;animation:fadeUp 0.42s ease both;}
.day-card-header{display:flex;align-items:center;justify-content:space-between;padding:0.7rem 0.85rem;background:var(--bg3);border-bottom:1px solid var(--border);}
.day-card-title{font-size:0.92rem;font-weight:700;color:var(--text1)}
.day-card-title.t-title{color:var(--cyan)}
.day-card-title.f-title{color:#a688ff}
.day-card-body{padding:0.75rem 0.85rem;display:flex;flex-direction:column;gap:0.6rem}
.card-row{display:flex;align-items:center;justify-content:space-between;gap:0.5rem}
.card-row-label{font-size:0.76rem;color:var(--text2);font-weight:500;min-width:60px}
.card-row-val{font-size:0.8rem;font-family:'JetBrains Mono',monospace;color:var(--text3)}
.card-row-val.green{color:var(--green);font-weight:600}
.tp-sel-lg{appearance:none;-webkit-appearance:none;background:rgba(255,255,255,0.07);border:1px solid var(--border2);border-radius:8px;padding:0.38rem 0.3rem;color:var(--text1);font-family:'JetBrains Mono',monospace;font-size:0.86rem;font-weight:500;outline:none;cursor:pointer;text-align:center;transition:border-color 0.12s,background 0.12s;-webkit-tap-highlight-color:transparent;}
.tp-sel-lg:focus{border-color:rgba(124,92,252,0.62);box-shadow:0 0 0 2px rgba(124,92,252,0.15);background:rgba(124,92,252,0.06)}
.tp-sel-lg.future-tp{border-color:rgba(124,92,252,0.3)}
.tp-sel-lg.future-tp:focus{border-color:rgba(124,92,252,0.65)}
.tp-sep-lg{color:var(--text2);font-family:'JetBrains Mono',monospace;font-size:0.95rem;margin:0 2px}

/* ACTION BAR */
.action-bar{background:var(--bg3);padding:0.7rem 0.85rem;display:flex;align-items:center;justify-content:flex-end;gap:0.55rem;border-top:1px solid var(--border);}
.btn-primary{padding:0.48rem 1rem;border:none;border-radius:var(--r-sm);font-family:'Outfit',sans-serif;font-size:0.83rem;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(135deg,#7c5cfc,#00d4ff);box-shadow:0 3px 12px rgba(124,92,252,0.32);transition:transform 0.12s,box-shadow 0.12s;-webkit-tap-highlight-color:transparent;}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 5px 18px rgba(124,92,252,0.5)}
.btn-primary:active{transform:scale(0.97)}
.btn-ghost{padding:0.48rem 0.85rem;border:1px solid var(--border2);border-radius:var(--r-sm);background:transparent;color:var(--text3);font-family:'Outfit',sans-serif;font-size:0.8rem;cursor:pointer;transition:all 0.12s;-webkit-tap-highlight-color:transparent;}
.btn-ghost:hover{background:rgba(255,255,255,0.04);color:var(--text1)}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:0.75rem;margin-bottom:1.2rem;animation:fadeUp 0.5s ease 0.18s both;}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:0.95rem 0.85rem;position:relative;overflow:hidden;transition:border-color 0.18s,transform 0.18s;}
.stat-card:hover{border-color:var(--border2);transform:translateY(-2px)}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--gradient,linear-gradient(90deg,#7c5cfc,#00d4ff))}
.sc-g1{--gradient:linear-gradient(90deg,#7c5cfc,#00d4ff)}
.sc-g2{--gradient:linear-gradient(90deg,#ff4d8d,#ffd93d)}
.sc-g3{--gradient:linear-gradient(90deg,#00e5a0,#00d4ff)}
.sc-g4{--gradient:linear-gradient(90deg,#ffd93d,#ff8c42)}
.stat-val{font-size:1.55rem;font-weight:800;letter-spacing:-0.03em;margin-bottom:0.12rem;font-variant-numeric:tabular-nums}
.sv-purple{background:linear-gradient(135deg,#7c5cfc,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sv-pink{background:linear-gradient(135deg,#ff4d8d,#ffd93d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sv-green{background:linear-gradient(135deg,#00e5a0,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sv-yellow{background:linear-gradient(135deg,#ffd93d,#ff8c42);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-label{font-size:0.68rem;color:var(--text2);font-weight:500;letter-spacing:0.05em;text-transform:uppercase}

/* PROGRESS */
.progress-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem;margin-bottom:1.2rem;animation:fadeUp 0.5s ease 0.28s both;}
.prog-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.9rem}
.prog-title{font-size:0.98rem;font-weight:700}
.prog-pct-badge{font-size:0.8rem;font-weight:700;font-family:'JetBrains Mono',monospace;background:rgba(124,92,252,0.1);border:1px solid rgba(124,92,252,0.25);color:#a688ff;padding:0.2rem 0.6rem;border-radius:50px;}
.bar-stack{position:relative;height:9px;border-radius:50px;background:rgba(255,255,255,0.04);margin-bottom:0.5rem;overflow:hidden;}
.plan-fill{position:absolute;top:0;left:0;bottom:0;border-radius:50px;width:0%;background:rgba(255,255,255,0.2);transition:width 1.1s cubic-bezier(0.34,1.4,0.64,1);z-index:1;}
.rainbow-fill{position:absolute;top:0;left:0;bottom:0;border-radius:50px;width:0%;background:linear-gradient(90deg,#ff0080,#ff4d00,#ffd700,#00e5a0,#00d4ff,#7c5cfc);background-size:300% 100%;animation:rainbowFlow 6s linear infinite;transition:width 1.1s cubic-bezier(0.34,1.4,0.64,1);z-index:2;}
@keyframes rainbowFlow{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.bar-marks{position:absolute;inset:0;border-radius:50px;pointer-events:none;z-index:3}
.bar-mark{position:absolute;top:0;bottom:0;width:1px;background:rgba(0,0,0,0.28)}
.bar-legend{display:flex;align-items:center;justify-content:space-between;font-size:0.7rem;color:var(--text2);font-family:'JetBrains Mono',monospace;margin-bottom:0.3rem;}
.legend-left{display:flex;align-items:center;gap:0.8rem}
.legend-item{display:flex;align-items:center;gap:0.3rem}
.legend-dot{width:7px;height:7px;border-radius:2px;display:inline-block;flex-shrink:0}
.legend-dot.actual{background:linear-gradient(90deg,#7c5cfc,#00d4ff)}
.legend-dot.planned{background:rgba(255,255,255,0.25)}
.legend-val{color:var(--text1);font-weight:600}
#prog-mid{color:var(--text3)}

.predict-banner{margin-top:0.9rem;padding:0.8rem 0.95rem;border-radius:var(--r-sm);background:rgba(124,92,252,0.06);border:1px solid rgba(124,92,252,0.18);display:flex;align-items:flex-start;gap:0.7rem;font-size:0.82rem;line-height:1.62;}
.predict-icon{font-size:1.15rem;flex-shrink:0;margin-top:0.05rem}
.predict-text .highlight{background:linear-gradient(90deg,#7c5cfc,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:700}
.predict-text strong{color:#a688ff}
.done-banner{margin-top:0.9rem;padding:0.9rem 1rem;border-radius:var(--r-sm);background:linear-gradient(135deg,rgba(0,229,160,0.1),rgba(0,212,255,0.06));border:1px solid rgba(0,229,160,0.3);display:flex;align-items:center;gap:0.7rem;font-size:0.86rem;}
.done-banner .done-icon{font-size:1.5rem;animation:bounce 1s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.done-banner strong{color:var(--green);font-size:0.92rem}

/* TOAST */
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(22,22,30,0.96);backdrop-filter:blur(16px);border:1px solid var(--border2);border-radius:50px;padding:0.6rem 1.2rem;font-size:0.83rem;color:var(--text1);z-index:999;transition:transform 0.28s cubic-bezier(0.34,1.56,0.64,1),opacity 0.28s;opacity:0;pointer-events:none;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

footer{text-align:center;color:var(--text2);font-size:0.72rem;padding-top:1.6rem}

/* CREDIT BAR */
.credit-bar{position:fixed;top:0;left:0;right:0;z-index:999;background:rgba(11,11,15,0.9);backdrop-filter:blur(12px);border-bottom:1px solid rgba(124,92,252,0.15);padding:0.32rem 1rem;display:flex;align-items:center;justify-content:center;gap:0.38rem;flex-wrap:nowrap;white-space:nowrap;overflow:hidden;font-size:0.7rem;color:var(--text2);min-height:28px;}
.credit-bar .credit-name{color:#a688ff;font-weight:700}
.credit-bar .credit-role{color:var(--text3)}
.credit-bar .credit-disclaimer{color:var(--text2);font-size:0.64rem;background:rgba(255,255,255,0.05);border:1px solid var(--border);padding:0.08rem 0.45rem;border-radius:50px;}
.app{padding-top:3rem}

/* RESPONSIVE */
@media(max-width:767px){
  html{font-size:15px}
  .credit-bar{font-size:0.63rem;gap:0.25rem;padding:0.28rem 0.55rem;min-height:24px}
  .credit-bar .credit-disclaimer{font-size:0.58rem;padding:0.07rem 0.35rem}
  .app{padding-top:2.6rem;padding-left:0.7rem;padding-right:0.7rem;padding-bottom:3.2rem}
  .logo-img{height:68px}
  .header-title h1{font-size:1.2rem}
  #clock-display{font-size:1.35rem}
  .week-table-wrap{display:none}
  .week-cards{display:flex}
  .stats-row{grid-template-columns:1fr 1fr;gap:0.5rem}
  .stat-val{font-size:1.38rem}
  .progress-card{padding:0.95rem}
  .predict-banner{font-size:0.78rem;gap:0.55rem;padding:0.7rem 0.85rem}
  .header{margin-bottom:1.1rem;padding-bottom:0.95rem}
}
@media(max-width:400px){
  .header-left{gap:0.7rem}
  .logo-img{height:54px}
  .header-title h1{font-size:1.05rem}
  #clock-display{font-size:1.18rem}
  .stats-row{gap:0.42rem}
  .stat-val{font-size:1.2rem}
}
</style>
</head>
<body>
<div class="credit-bar">
  <span>By</span>
  <span class="credit-name">이윤재</span>
  <span class="credit-role">AI PM 인턴</span>
  <span class="credit-disclaimer">😇 업무시간에 만든거 아님</span>
</div>
<div class="glow-a"></div>
<div class="glow-b"></div>
<div class="app">
  <header class="header">
    <div class="header-left">
      <img class="logo-img" src="jj라이언~.svg" alt="라이언" onerror="this.style.display='none'"/>
      <div class="header-title">
        <h1>이제 <span>퇴근해도 돼?</span></h1>
        <p>현명하게 일하고 제때 퇴근하세요</p>
      </div>
    </div>
    <div class="header-right">
      <div class="live-badge"><div class="live-dot"></div>LIVE</div>
      <div id="clock-display">00:00:00</div>
      <div id="date-display">로딩 중...</div>
    </div>
  </header>

  <div class="sec-label">📅 이번 주 근무 현황</div>

  <div class="week-table-wrap" id="desk-wrap">
    <div class="week-table-header" id="desk-header">
      <div class="wth-cell">구분</div>
    </div>
    <div id="desk-rows"></div>
    <div class="action-bar">
      <button class="btn-ghost" id="btn-reset-d">초기화</button>
      <button class="btn-primary" id="btn-calc-d">✦ 계산하기</button>
    </div>
  </div>

  <div class="week-cards" id="mob-cards"></div>
  <div class="action-bar" id="mob-actions" style="display:none;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:1.2rem;animation:fadeUp 0.5s ease 0.12s both">
    <button class="btn-ghost" id="btn-reset-m">초기화</button>
    <button class="btn-primary" id="btn-calc-m">✦ 계산하기</button>
  </div>

  <div class="stats-row">
    <div class="stat-card sc-g1"><div class="stat-val sv-purple" id="st-worked">0h</div><div class="stat-label">실 근무</div></div>
    <div class="stat-card sc-g2"><div class="stat-val sv-pink"   id="st-remain">40h</div><div class="stat-label">남은 시간</div></div>
    <div class="stat-card sc-g3"><div class="stat-val sv-green"  id="st-break">0h</div><div class="stat-label">차감 휴게</div></div>
    <div class="stat-card sc-g4"><div class="stat-val sv-yellow" id="st-pct">0%</div><div class="stat-label">달성률</div></div>
  </div>

  <div class="progress-card">
    <div class="prog-header">
      <div class="prog-title">주 40시간 달성 현황</div>
      <div class="prog-pct-badge" id="pct-badge">0%</div>
    </div>
    <div class="bar-stack">
      <div class="plan-fill" id="plan-fill"></div>
      <div class="rainbow-fill" id="bar-fill"></div>
      <div class="bar-marks" id="bar-marks"></div>
    </div>
    <div class="bar-legend">
      <div class="legend-left">
        <span class="legend-item"><span class="legend-dot actual"></span><span class="legend-val" id="legend-actual">0h</span>&nbsp;실근무</span>
        <span class="legend-item"><span class="legend-dot planned"></span><span class="legend-val" id="legend-planned">—</span>&nbsp;예정</span>
      </div>
      <span id="prog-mid">— / 40h</span>
    </div>
    <div id="predict-area"></div>
  </div>

  <footer>💜 퇴근해 트래커 · 현명하게 일하고 제때 퇴근하세요</footer>
</div>

<div class="toast" id="toast"></div>

<script>
const TARGET = 40;
const DAYS_KO = ['일','월','화','수','목','금','토'];
const STORE = 'gohome-v5';
const pad = n => String(n).padStart(2,'0');
const calcBreak = g => g<=0 ? 0 : Math.floor(g/4)*0.5;
const netHrs = g => Math.max(0, g - calcBreak(g));
function fmtHr(h){
  if(h==null||isNaN(h)||h<0) return '—';
  if(h===0) return '0h';
  const w=Math.floor(h), m=Math.round((h-w)*60);
  return m===0?`${w}h`:`${w}h ${pad(m)}m`;
}
function timeDecimal(str){ if(!str) return null; const[h,m]=str.split(':').map(Number); return h+m/60; }
function getMonday(d){ const dt=new Date(d), day=dt.getDay(); dt.setDate(dt.getDate()+(day===0?-6:1-day)); dt.setHours(0,0,0,0); return dt; }
function loadData(){ try{return JSON.parse(localStorage.getItem(STORE))||{};}catch{return{};} }
function saveData(d){ localStorage.setItem(STORE, JSON.stringify(d)); }

// CLOCK
function tick(){
  const now=new Date(), h=now.getHours(), m=now.getMinutes(), s=now.getSeconds();
  const ampm=h>=12?'오후':'오전', h12=h%12||12;
  document.getElementById('clock-display').textContent=`${pad(h12)}:${pad(m)}:${pad(s)}`;
  const yr=now.getFullYear(), mo=now.getMonth()+1, da=now.getDate();
  document.getElementById('date-display').textContent=`${yr}년 ${mo}월 ${da}일 (${DAYS_KO[now.getDay()]}요일) · ${ampm}`;
}
tick(); setInterval(tick,1000);

// WEEK SETUP
const todayDate = new Date();
const monday = getMonday(todayDate);
const weekDays = Array.from({length:5},(_,i)=>{ const d=new Date(monday); d.setDate(monday.getDate()+i); return d; });

function dayStatus(i){
  const d=new Date(weekDays[i]); d.setHours(0,0,0,0);
  const now=new Date(); now.setHours(0,0,0,0);
  if(d<now) return 'past';
  if(d.getTime()===now.getTime()) return 'today';
  return 'future';
}

// TIME PICKER — restricted hours
const START_HOURS = [8, 9, 10];
const END_HOURS   = [16,17,18,19,20,21,22,23];

// MINUTE SPINNER — scroll wheel / swipe to change
function makeMinSpinner(initM, isFuture, lg, onMinChange){
  const fm = isFuture ? ' future-tp' : '';
  let val = Math.max(0, Math.min(59, initM));

  const wrap = document.createElement('div');
  wrap.className = 'min-spin' + (lg ? ' min-spin-lg' : '') + fm;
  wrap.style.width = lg ? '60px' : '46px';

  const btnUp = document.createElement('div');
  btnUp.className = 'min-spin-btn'; btnUp.textContent = '▲';

  const valEl = document.createElement('div');
  valEl.className = 'min-spin-val';
  valEl.style.fontSize = lg ? '0.86rem' : '0.74rem';
  valEl.textContent = pad(val);

  const btnDn = document.createElement('div');
  btnDn.className = 'min-spin-btn'; btnDn.textContent = '▼';

  function set(v){
    val = ((v % 60) + 60) % 60;
    valEl.textContent = pad(val);
    onMinChange(val);
  }

  btnUp.addEventListener('click', () => set(val - 1));
  btnDn.addEventListener('click', () => set(val + 1));

  // Mouse wheel
  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    set(val + (e.deltaY > 0 ? 1 : -1));
  }, {passive: false});

  // Touch drag (swipe up = increase, swipe down = decrease)
  let touchStartY = null;
  wrap.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, {passive:true});
  wrap.addEventListener('touchmove', e => {
    if(touchStartY == null) return;
    e.preventDefault();
    const dy = touchStartY - e.touches[0].clientY;
    if(Math.abs(dy) >= 12){
      set(val + (dy > 0 ? 1 : -1));
      touchStartY = e.touches[0].clientY;
    }
  }, {passive: false});
  wrap.addEventListener('touchend', () => { touchStartY = null; });

  // Focus styling
  wrap.setAttribute('tabindex', '0');
  wrap.addEventListener('focus', () => wrap.classList.add('focused'));
  wrap.addEventListener('blur',  () => wrap.classList.remove('focused'));
  wrap.addEventListener('keydown', e => {
    if(e.key === 'ArrowUp')   { e.preventDefault(); set(val - 1); }
    if(e.key === 'ArrowDown') { e.preventDefault(); set(val + 1); }
  });

  wrap.append(btnUp, valEl, btnDn);
  return { el: wrap, getValue: () => val };
}

function makeTimePicker(savedVal, type, size, role, onChange){
  const hours = role === 'start' ? START_HOURS : END_HOURS;
  const defaultH = hours[0];
  let initH = defaultH, initM = 0;
  if(savedVal){
    const p = savedVal.split(':').map(Number);
    initH = hours.includes(p[0]) ? p[0] : defaultH;
    initM = p[1];
  }
  const lg = size === 'lg';
  const selCls = lg ? 'tp-sel-lg' : 'tp-sel';
  const sepCls = lg ? 'tp-sep-lg' : 'tp-sep';
  const pickerCls = lg ? 'time-picker-lg' : 'time-picker';
  const isFuture = type === 'future';
  const fm = isFuture ? ' future-tp' : '';
  const w = lg ? '60px' : '46px';

  const wrap = document.createElement('div');
  wrap.className = pickerCls;

  const hourSel = document.createElement('select');
  hourSel.className = selCls + fm;
  hourSel.style.width = w;
  hours.forEach(h => {
    const o = document.createElement('option');
    o.value = h; o.textContent = pad(h); hourSel.appendChild(o);
  });
  hourSel.value = initH;

  const sep = document.createElement('span');
  sep.className = sepCls; sep.textContent = ':';

  const minSpinner = makeMinSpinner(initM, isFuture, lg, () => fire());

  function fire(){
    onChange(`${pad(parseInt(hourSel.value))}:${pad(minSpinner.getValue())}`);
  }
  hourSel.addEventListener('change', fire);

  wrap.append(hourSel, sep, minSpinner.el);
  return wrap;
}

// COMPUTE
function computeDay(dd, st){
  if(st === 'future'){
    if(!dd.fstart || !dd.fend) return {gross:null, net:null};
    const g = timeDecimal(dd.fend) - timeDecimal(dd.fstart);
    return g > 0 ? {gross:g, net:netHrs(g)} : {gross:null, net:null};
  }
  if(!dd.start || !dd.end) return {gross:null, net:null};
  const g = timeDecimal(dd.end) - timeDecimal(dd.start);
  return g > 0 ? {gross:g, net:netHrs(g)} : {gross:null, net:null};
}

// BUILD DESKTOP
function buildDesktop(){
  const data = loadData();
  const hdr = document.getElementById('desk-header');
  hdr.innerHTML = '<div class="wth-cell">구분</div>';
  weekDays.forEach((d,i) => {
    const st = dayStatus(i);
    const cell = document.createElement('div');
    cell.className = `wth-cell${st==='today'?' t-col':''}`;
    const mo = d.getMonth()+1, da = d.getDate();
    let inner = `<div class="dn">${mo}/${da} (${DAYS_KO[d.getDay()]})</div>`;
    if(st==='today') inner += `<div class="today-badge">오늘</div>`;
    cell.innerHTML = inner; hdr.appendChild(cell);
  });

  const rowsEl = document.getElementById('desk-rows');
  rowsEl.innerHTML = '';
  const rowDefs = [
    {key:'status', label:'출결'},
    {key:'start',  label:'출근'},
    {key:'end',    label:'퇴근'},
    {key:'net',    label:'인정 근무'},
  ];
  rowDefs.forEach(row => {
    const tr = document.createElement('div'); tr.className = 'week-row-dt';
    const lbl = document.createElement('div'); lbl.className = 'rl'; lbl.textContent = row.label;
    tr.appendChild(lbl);
    weekDays.forEach((_,i) => {
      const st = dayStatus(i);
      const cell = document.createElement('div');
      cell.className = `dc${st==='today'?' t-col':''}`;
      const dd = data[`day-${i}`] || {};
      if(row.key === 'status'){
        if(st==='past') cell.innerHTML = `<span class="status-pill pill-done">✓ 완료</span>`;
        else if(st==='today') cell.innerHTML = `<span class="status-pill pill-today">● 근무 중</span>`;
        else cell.innerHTML = `<span class="status-pill pill-plan">○ 예정</span>`;
      } else if(row.key === 'start'){
        const saved = st==='future' ? (dd.fstart||null) : (dd.start||null);
        cell.appendChild(makeTimePicker(saved, st, 'sm', 'start',
          str => { saveDayField(i, st==='future'?'fstart':'start', str); refreshDesktop(i); updateStats(); }));
      } else if(row.key === 'end'){
        const saved = st==='future' ? (dd.fend||null) : (dd.end||null);
        cell.appendChild(makeTimePicker(saved, st, 'sm', 'end',
          str => { saveDayField(i, st==='future'?'fend':'end', str); refreshDesktop(i); updateStats(); }));
      } else if(row.key === 'net'){
        const el = document.createElement('span');
        el.id = `d-net-${i}`;
        el.style.cssText = "font-family:'JetBrains Mono',monospace;color:var(--green);font-weight:600;font-size:0.78rem";
        const {net} = computeDay(dd, st); el.textContent = net ? fmtHr(net) : '—';
        cell.appendChild(el);
      }
      tr.appendChild(cell);
    });
    rowsEl.appendChild(tr);
  });
}

function refreshDesktop(i){
  const data = loadData(), dd = data[`day-${i}`]||{}, st = dayStatus(i);
  const {net} = computeDay(dd, st);
  const ne = document.getElementById(`d-net-${i}`);
  if(ne) ne.textContent = net ? fmtHr(net) : '—';
}

// BUILD MOBILE
function buildMobile(){
  const data = loadData();
  const container = document.getElementById('mob-cards');
  container.innerHTML = '';
  weekDays.forEach((d,i) => {
    const st = dayStatus(i), dd = data[`day-${i}`]||{};
    const {gross, net} = computeDay(dd, st);
    const mo = d.getMonth()+1, da = d.getDate();
    const card = document.createElement('div');
    card.className = 'day-card'; card.style.animationDelay = `${i*0.055}s`;
    let pillHtml = '';
    if(st==='past') pillHtml = `<span class="status-pill pill-done">✓ 완료</span>`;
    else if(st==='today') pillHtml = `<span class="status-pill pill-today">● 근무 중</span>`;
    else pillHtml = `<span class="status-pill pill-plan">○ 예정</span>`;
    const titleCls = st==='today'?' t-title':st==='future'?' f-title':'';
    card.innerHTML = `
      <div class="day-card-header">
        <span class="day-card-title${titleCls}">${mo}/${da} (${DAYS_KO[d.getDay()]}요일)${st==='today'?' 🔵':''}</span>
        ${pillHtml}
      </div>
      <div class="day-card-body" id="mcb-${i}"></div>`;
    container.appendChild(card);
    buildMobileCardBody(i, st, dd, gross, net);
  });
}

function buildMobileCardBody(i, st, dd, gross, net){
  const body = document.getElementById(`mcb-${i}`);
  if(!body) return;
  body.innerHTML = '';
  const startRow = document.createElement('div'); startRow.className = 'card-row';
  const startLbl = document.createElement('span'); startLbl.className = 'card-row-label'; startLbl.textContent = '출근';
  const startPk = makeTimePicker(
    st==='future'?(dd.fstart||null):(dd.start||null), st, 'lg', 'start',
    str => { saveDayField(i, st==='future'?'fstart':'start', str); refreshMobile(i); updateStats(); }
  );
  startRow.append(startLbl, startPk); body.appendChild(startRow);

  const endRow = document.createElement('div'); endRow.className = 'card-row';
  const endLbl = document.createElement('span'); endLbl.className = 'card-row-label';
  endLbl.textContent = st==='today' ? '예상 퇴근' : '퇴근';
  const endPk = makeTimePicker(
    st==='future'?(dd.fend||null):(dd.end||null), st, 'lg', 'end',
    str => { saveDayField(i, st==='future'?'fend':'end', str); refreshMobile(i); updateStats(); }
  );
  endRow.append(endLbl, endPk); body.appendChild(endRow);

  const netRow = document.createElement('div'); netRow.className = 'card-row';
  netRow.innerHTML = `<span class="card-row-label">인정 근무</span><span class="card-row-val green" id="m-net-${i}">${net?fmtHr(net):'—'}</span>`;
  body.appendChild(netRow);
}

function refreshMobile(i){
  const data = loadData(), dd = data[`day-${i}`]||{}, st = dayStatus(i);
  const {net} = computeDay(dd, st);
  const ne = document.getElementById(`m-net-${i}`);
  if(ne) ne.textContent = net ? fmtHr(net) : '—';
}

// STATS
function computeAll(){
  const data = loadData();
  let workedNet=0, workedBreak=0, plannedNet=0;
  weekDays.forEach((_,i) => {
    const st = dayStatus(i), dd = data[`day-${i}`]||{};
    const {gross, net} = computeDay(dd, st);
    if(gross == null) return;
    if(st === 'future'){ plannedNet += net||0; }
    else { workedNet += net||0; workedBreak += calcBreak(gross); }
  });
  return {workedNet, workedBreak, plannedNet};
}

function updateStats(){
  const {workedNet, workedBreak, plannedNet} = computeAll();
  const total = workedNet + plannedNet;
  const pct = Math.min(100, (workedNet/TARGET)*100);
  const pctIfPlan = Math.min(100, (total/TARGET)*100);
  const remain = Math.max(0, TARGET - workedNet);

  document.getElementById('st-worked').textContent = fmtHr(workedNet);
  document.getElementById('st-remain').textContent = fmtHr(remain);
  document.getElementById('st-break').textContent  = fmtHr(workedBreak);
  document.getElementById('st-pct').textContent    = `${Math.round(pct)}%`;
  document.getElementById('bar-fill').style.width  = pct + '%';
  document.getElementById('plan-fill').style.width = pctIfPlan + '%';
  document.getElementById('pct-badge').textContent = `${Math.round(pct)}%`;
  document.getElementById('prog-mid').textContent  = `${fmtHr(workedNet)} / 40h`;
  document.getElementById('legend-actual').textContent  = fmtHr(workedNet);
  document.getElementById('legend-planned').textContent = plannedNet > 0 ? fmtHr(plannedNet) : '—';

  const marks = document.getElementById('bar-marks'); marks.innerHTML = '';
  [25,50,75].forEach(p => {
    const el = document.createElement('div'); el.className = 'bar-mark'; el.style.left = p+'%';
    marks.appendChild(el);
  });

  const area = document.getElementById('predict-area');
  if(workedNet >= TARGET){
    area.innerHTML = `<div class="done-banner"><span class="done-icon">🏠</span><div><strong>완료! 이제 퇴근해도 됩니다!</strong><br/><span style="font-size:0.78rem;color:var(--text3)">주 40시간 목표 달성! 수고하셨어요 🎉</span></div></div>`;
  } else if(plannedNet > 0){
    const willDone = total >= TARGET, stillNeed = Math.max(0, TARGET - total);
    area.innerHTML = `<div class="predict-banner"><span class="predict-icon">${willDone?'🎯':'📊'}</span>
    <div class="predict-text">${willDone
      ? `예정대로 일하면 이번 주 <span class="highlight">총 ${fmtHr(total)}</span> 달성! <strong style="color:var(--green)">목표 ✓</strong>`
      : `예정대로 일하면 <span class="highlight">${fmtHr(total)}</span> 채워져요. <strong style="color:var(--pink)">${fmtHr(stillNeed)}</strong> 더 필요해요.`
    }<br/><span style="font-size:0.75rem;color:var(--text2)">실근무 ${fmtHr(workedNet)} + 예정 ${fmtHr(plannedNet)} = ${Math.round(pctIfPlan)}% 예상</span>
    </div></div>`;
  } else {
    area.innerHTML = `<div class="predict-banner"><span class="predict-icon">💡</span>
    <div class="predict-text">현재 <span class="highlight">${fmtHr(workedNet)}</span> 근무했어요. 목표까지 <strong>${fmtHr(remain)}</strong> 남았습니다.<br/>
    <span style="font-size:0.75rem;color:var(--text2)">남은 날 예정 시간을 입력하면 달성 여부를 볼 수 있어요 👆</span>
    </div></div>`;
  }
}

function saveDayField(i, field, val){
  const data = loadData();
  if(!data[`day-${i}`]) data[`day-${i}`] = {};
  data[`day-${i}`][field] = val;
  saveData(data);
}
function doReset(){
  if(!confirm('이번 주 입력 내용을 모두 초기화할까요?')) return;
  localStorage.removeItem(STORE);
  buildDesktop(); buildMobile(); updateStats();
  showToast('초기화되었습니다');
}
function doCalc(){ updateStats(); showToast('✦ 계산 완료!'); }

document.getElementById('btn-calc-d').addEventListener('click', doCalc);
document.getElementById('btn-reset-d').addEventListener('click', doReset);
document.getElementById('btn-calc-m').addEventListener('click', doCalc);
document.getElementById('btn-reset-m').addEventListener('click', doReset);

function handleResize(){
  const mob = window.innerWidth < 768;
  document.getElementById('mob-actions').style.display = mob ? 'flex' : 'none';
}
handleResize();
window.addEventListener('resize', handleResize);

function showToast(msg){
  const t = document.getElementById('toast'); t.textContent = msg;
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2800);
}

buildDesktop();
buildMobile();
updateStats();
</script>
</body>
</html>
